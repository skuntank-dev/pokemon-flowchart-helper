  else menu.appendChild(el);
};


/* ---------------------------------------------------------------------
   13. Field tokens across a side flip.
   The original translator walks a token's slot letters. A `field` token has
   no slot letters — its side is spelled out as "/self" or "/opp" — so it
   passes through untouched and has to be flipped separately.
   --------------------------------------------------------------------- */
const __origFlipSides = flipSides;
flipSides = function () {
  state.nodes.forEach(n => {
    (n.snapshot.log || []).forEach(e => {
      if (e.raw && e.raw.indexOf('field ') === 0) {
        e.raw = e.raw.replace(/\/(self|opp)\b/g, (_, sd) => '/' + (sd === 'self' ? 'opp' : 'self'));
      }
    });
    (n.snapshot.fieldEffects || []).forEach(f => {
      if (f.side) f.side = f.side === 'self' ? 'opp' : 'self';
    });
  });
  __origFlipSides();
};


/* ---------------------------------------------------------------------
   14. Per-side import accepts a pokepast.es link.

   The Import 1-6 / Import A-F dialogs are unchanged — same box, same button.
   If what was pasted is *only* a pokepaste link the team is fetched and
   loaded into that side; anything else falls through to the original
   Showdown-text parser untouched.

   Requiring the box to contain nothing but the link matters: team text can
   legitimately mention a URL in a comment, and that must still be treated as
   text.
   --------------------------------------------------------------------- */
const POKEPASTE_ONLY = /^(?:https?:\/\/)?(?:www\.)?pokepast\.es\/[A-Za-z0-9]+\/?(?:json|raw)?\/?$/i;

const __origImportTeamSide = importTeamSide;
importTeamSide = function (side, text) {
  const raw = String(text == null ? '' : text).trim();
  if (!POKEPASTE_ONLY.test(raw)) { __origImportTeamSide(side, text); return; }

  const where = side === 'opp' ? 'A-F' : '1-6';
  toast('Fetching pokepaste…');
  PasteImport.fetchPokepaste(raw).then(paste => {
    if (!paste.sets.length) { toast('That paste contained no readable sets.', 'warn'); return; }
    // Same semantics as pasting the text: fill from the first slot, and leave
    // any slots beyond the paste's length as they were.
    const slots = side === 'opp' ? SLOTS_OPP : SLOTS_SELF;
    paste.sets.slice(0, 6).forEach((set, i) => { state.pokemon[slots[i]] = set; });

    // A paste usually names its format in the notes; only let it decide the
    // generation when nothing more definite has already set one.
    const g = GenDetect.fromNotes(paste.notes);
    if (g && state.genWeak) { Apply.maybeSetGen(g); refreshDexLists(); }

    rebuildAllNodes();
    renderTeams();
    renderAll();
    const n = Math.min(paste.sets.length, 6);
    toast('Loaded ' + n + ' set' + (n === 1 ? '' : 's') + ' from "' +
          (paste.title || 'pokepaste') + '" into ' + where +
          (g && state.gen === g.gen ? ' (' + GenDetect.label(state.gen) + ')' : '') + '.', 'good');
  }).catch(e => toast('Import failed: ' + (e && e.message ? e.message : e), 'bad'));
};

/* Say so in the dialog, and let Enter submit when a link is pasted. */
const __origOpenImportSideModal = openImportSideModal;
openImportSideModal = function (side) {
  __origOpenImportSideModal(side);
  const backdrop = document.querySelector('.modal-backdrop');
  if (!backdrop) return;
  const hint = backdrop.querySelector('div[style*="ink-mute"]');
  if (hint) {
    hint.innerHTML = 'Paste a Showdown-format team (up to 6, separated by blank lines) ' +
                     '&mdash; or just a <b>pokepast.es</b> link.';
  }
  const ta = backdrop.querySelector('#ta');
  const okBtn = backdrop.querySelector('#okBtn');
  if (ta) {
    ta.placeholder = 'https://pokepast.es/…    or a full Showdown export';
    ta.addEventListener('keydown', e => {
      // A link is one line, so Enter should submit rather than add a newline.
      if (e.key === 'Enter' && !e.shiftKey && POKEPASTE_ONLY.test(ta.value.trim())) {
        e.preventDefault();
        okBtn.click();
      }
    });
  }
};


/* ---------------------------------------------------------------------
   15. The generation travels with the flowchart.

   Champions is a different generation in the calculator, with its own stat
   formula and species list, so a chart exported from a Champions battle and
   re-imported as Gen 9 silently produces wrong numbers everywhere. A
   "Generation:" line now sits at the top of the export and is read back on
   import.

   Every export path funnels through exportFlowchart() and every import
   through importFlowchart() — the Export dialog, the Import dialog, Export
   as URL and the #fc= hash loader — so wrapping those two covers all four.

   Files without the line still load exactly as before and keep whatever
   generation is currently selected.
   --------------------------------------------------------------------- */

function generationLine() { return 'Generation: ' + GenDetect.label(state.gen); }

/* Accepts "Champions", "Gen 9", "gen9", "9", "0". */
function parseGenerationLabel(v) {
  const t = String(v || '').trim();
  if (!t) return null;
  if (/champion/i.test(t)) return 0;
  const m = t.match(/(\d+)/);
  if (!m) return null;
  const n = parseInt(m[1], 10);
  return (n >= 0 && n <= 9) ? n : null;
}

const __exportBeforeGen = exportFlowchart;
exportFlowchart = function () {
  return generationLine() + '\n\n' + __exportBeforeGen();
};

const __importBeforeGen = importFlowchart;
importFlowchart = function (text) {
  const lines = String(text == null ? '' : text).split(/\r?\n/);
  let found = null;
  // Only look in the header, before the first team block, so a Pokemon
  // nicknamed something unfortunate can never be read as a directive.
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i].trim();
    if (/^[A-F1-6]:\s*\S/.test(ln) || /^On field:/i.test(ln)) break;
    const m = ln.match(/^Generation\s*:\s*(.+)$/i);
    if (m) {
      found = parseGenerationLabel(m[1]);
      lines.splice(i, 1);              // hide it from the original parser
      break;
    }
  }
  if (found != null) {
    // An explicit line is authoritative: it must not be second-guessed later
    // by a pokepaste's notes.
    state.gen = found;
    state.genWhy = 'read from the imported flowchart';
    state.genWeak = false;
    Dex.setGen(found);
    refreshDexLists();
  }
  __importBeforeGen(lines.join('\n'));
  updateGenChip();
  if (found != null) toast('Generation: ' + GenDetect.label(found) + '.', 'good');
};

/* The per-side team box tolerates the same line if someone pastes a whole
   header in, but never emits one — that box speaks Showdown's own format,
   which other tools read. */
const __importTeamSideBeforeGen = importTeamSide;
importTeamSide = function (side, text) {
  const raw = String(text == null ? '' : text);
  const m = raw.match(/^[ \t]*Generation\s*:\s*(.+?)[ \t]*$/im);
  if (m) {
    const g = parseGenerationLabel(m[1]);
    if (g != null) {
      state.gen = g; state.genWhy = 'read from the pasted team'; state.genWeak = false;
      Dex.setGen(g); refreshDexLists(); updateGenChip();
    }
    return __importTeamSideBeforeGen(side, raw.replace(m[0], '').replace(/^\s*\n/, ''));
  }
  return __importTeamSideBeforeGen(side, text);
};


/* ---------------------------------------------------------------------
   16. Field effect scope: sides, inheritance and exclusivity.

   Three related problems, all rooted in field effects having been a flat
   {name, turns} list that nothing owned:

   1. Tailwind appeared twice after pressing Next Turn. The original seeds the
      new node's effects from its parent, mapping to {name, turns-1} — which
      drops `side` and `auto`. The rebuild also derives inheritance from the
      parent, keeping both. The two copies then differ by side, so the
      de-duplicator saw them as different effects and kept both.
      Inheritance now has exactly one owner: the rebuild. The seeded copies
      are ignored, and anything genuinely authored (typed into the Field
      dialog, or read from an imported file) is tagged so it survives.

   2. Tailwind is per side. It always was in the rules table, but the seeded
      copy lost the side, the Field dialog could not set one, and nothing
      displayed it.

   3. Weather is exclusive. Setting rain over sun has to replace it, not
      stack. Same for terrain.
   --------------------------------------------------------------------- */

/* Effects that belong to the whole field rather than to one side. */
function fxKind(name) {
  if (Calc.mapWeather(name)) return 'weather';
  if (Calc.mapTerrain(name)) return 'terrain';
  return null;
}
function fxIsGlobal(name) {
  return !!fxKind(name) || /^(trickroom|magicroom|wonderroom|gravity)$/.test(toID(name));
}

/* Only one weather and one terrain may be up. Earlier entries win, and the
   list is always built newest-first, so a freshly set weather replaces the one
   carried over from last turn. */
function fxEnforceExclusive(list) {
  let haveWeather = false, haveTerrain = false;
  return list.filter(f => {
    const k = fxKind(f.name);
    if (k === 'weather') { if (haveWeather) return false; haveWeather = true; }
    if (k === 'terrain') { if (haveTerrain) return false; haveTerrain = true; }
    return true;
  });
}

/* Normalise before storing: a global effect never carries a side. */
function fxNormalise(f) {
  if (fxIsGlobal(f.name)) f.side = null;
  return f;
}

/* Replaces the earlier wrapper. Inheritance is derived here and nowhere else. */
rebuildNode = function (node) {
  // Authored effects only. An effect seeded by the Next Turn button carries no
  // `auto` flag at all and is deliberately excluded: re-deriving it from the
  // parent below is what keeps its side and timer correct.
  const manual = (node.snapshot.fieldEffects || [])
    .filter(f => f.auto === false)
    .map(f => fxNormalise(Object.assign({}, f)));

  const parent = findParentForArrow(node);
  const inherited = (parent && parent.turn > 0 ? (parent.snapshot.fieldEffects || []) : [])
    .filter(f => f.hazard || f.turns > 1)
    .map(f => fxNormalise(Object.assign({}, f, { turns: f.hazard ? f.turns : f.turns - 1 })));

  __origRebuildNode(node);

  // Whatever this turn's log deleted stays deleted. `autoFx` is the replayed
  // result so it already honours a `field -Name` token, but `inherited` and
  // `manual` below are read straight off the parent and the old snapshot —
  // neither has seen the log. Merging them back in blind is what made a
  // deleted effect reappear the moment anything rebuilt the node, which read
  // as "the delete didn't take". Scanned in log order so a later re-add of
  // the same name wins over the earlier deletion.
  const removed = fxRemovedByLog(node);
  const alive = f => !removed.has(fxRemovalKey(f.name, f.side));

  // Newest first: what this turn set, then what carried over, then hand edits.
  const merged = (node.snapshot.autoFx || []).map(f => fxNormalise(Object.assign({}, f)));
  const put = f => {
    const dup = merged.some(x => toID(x.name) === toID(f.name) &&
                                 (x.side || null) === (f.side || null));
    if (!dup) merged.push(f);
  };
  inherited.filter(alive).forEach(put);
  manual.filter(alive).forEach(put);
  node.snapshot.fieldEffects = fxEnforceExclusive(merged);
};

/* Which effects this node's own log ends up having removed. A `field -Name`
   token marks one gone; a later plain `field Name` token brings it back, so
   the log is walked in order rather than just collected. */
function fxRemovalKey(name, side) { return toID(name) + '/' + (side || ''); }
function fxRemovedByLog(node) {
  const out = new Set();
  ((node.snapshot && node.snapshot.log) || []).forEach(e => {
    const raw = String((e && e.raw) || '');
    if (!raw.startsWith('field ')) return;
    const rest = raw.slice(6).trim();
    const rm = rest.startsWith('-');
    const bits = (rm ? rest.slice(1) : rest).split(/\s+/);
    const nameSide = String(bits[0] || '').split('/');
    const key = fxRemovalKey(String(nameSide[0] || '').replace(/_/g, ' '), nameSide[1] || null);
    if (rm) out.add(key); else out.delete(key);
  });
  return out;
}

/* Drops the `field -Name` tokens for one effect from a node's log, so that
   re-adding it by hand is not immediately undone by its own past deletion. */
function fxForgetRemoval(node, name, side) {
  const log = node.snapshot && node.snapshot.log;
  if (!log) return;
  const want = fxRemovalKey(name, side);
  for (let i = log.length - 1; i >= 0; i--) {
    const raw = String((log[i] && log[i].raw) || '');
    if (!raw.startsWith('field -')) continue;
    const bits = raw.slice(7).trim().split(/\s+/);
    const nameSide = String(bits[0] || '').split('/');
    if (fxRemovalKey(String(nameSide[0] || '').replace(/_/g, ' '), nameSide[1] || null) === want) {
      log.splice(i, 1);
    }
  }
}

/* Effects read from a saved flowchart are authored data, so they are tagged to
   survive a rebuild the same way dialog entries do. */
const __parseTurnLineBeforeFx = parseTurnLine;
parseTurnLine = function (line) {
  __parseTurnLineBeforeFx(line);
  const n = state.nodes[state.nodes.length - 1];
  if (n && n.snapshot && n.snapshot.fieldEffects) {
    n.snapshot.fieldEffects.forEach(f => { if (f.auto === undefined) f.auto = false; });
  }
};

/* ---- the Field dialog gains a side, and respects exclusivity ---------- */
const __origOpenFieldEffectsModal = openFieldEffectsModal;
openFieldEffectsModal = function () {
  __origOpenFieldEffectsModal();
  const backdrop = document.querySelector('.modal-backdrop');
  if (!backdrop) return;
  const node = getCurrentNode();
  if (!node) return;

  const turnsInp = backdrop.querySelector('#fxTurnsInput');
  const nameInp = backdrop.querySelector('#fxNameInput');
  if (!turnsInp || !nameInp) return;

  // Side selector, in the same style as the fields around it.
  const wrap = document.createElement('div');
  wrap.innerHTML =
    '<label style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);' +
    'text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px;margin-top:8px;">Side</label>' +
    '<select id="fxSideInput" style="width:100%;font-family:var(--mono);font-size:13px;padding:8px;' +
    'border:1px solid var(--line);border-radius:4px;background:var(--bg-1);color:var(--ink);">' +
    '<option value="">Whole field</option>' +
    '<option value="self">Your side (1-6)</option>' +
    '<option value="opp">Opponent (A-F)</option></select>';
  turnsInp.parentNode.insertBefore(wrap, turnsInp.nextSibling);
  const sideSel = wrap.querySelector('#fxSideInput');

  // Weather, terrain and the rooms are field-wide, so the selector locks off.
  const syncSide = () => {
    const global = fxIsGlobal(nameInp.value.trim());
    sideSel.disabled = global;
    sideSel.style.opacity = global ? 0.5 : 1;
    if (global) sideSel.value = '';
  };
  nameInp.addEventListener('input', syncSide);
  syncSide();

  // Take over the add button: the original allows only one effect per name,
  // which would stop both sides having Tailwind, and does not replace weather.
  const ok = backdrop.querySelector('#fxAddOk');
  const fresh = ok.cloneNode(true);
  ok.parentNode.replaceChild(fresh, ok);
  fresh.addEventListener('click', () => {
    const name = nameInp.value.trim();
    const turns = parseInt(turnsInp.value.trim(), 10);
    if (!name) { alert('Enter a field effect name.'); return; }
    if (isNaN(turns) || turns < 1) { alert('Turns must be a positive integer.'); return; }
    const side = sideSel.disabled ? null : (sideSel.value || null);
    const list = node.snapshot.fieldEffects = node.snapshot.fieldEffects || [];
    const kind = fxKind(name);
    if (kind) {
      // Only one weather, only one terrain.
      for (let i = list.length - 1; i >= 0; i--) if (fxKind(list[i].name) === kind) list.splice(i, 1);
    } else if (list.some(f => toID(f.name) === toID(name) && (f.side || null) === side)) {
      alert('"' + name + '" is already active' + (side ? ' on that side' : '') + ' this turn.');
      return;
    }
    list.unshift(fxNormalise({ name, turns, side, auto: false }));
    node.snapshot.fieldEffects = fxEnforceExclusive(list);
    // Re-adding something deleted earlier this turn clears that deletion,
    // otherwise the `field -Name` token below would strip it straight back
    // out on the next rebuild (see the removal filter in rebuildNode).
    fxForgetRemoval(node, name, side);
    // The current node has to be rebuilt too, not just its descendants:
    // rebuildNode is what re-derives fieldEffects, and without it the new
    // effect is only in the array until the next recalculation touches it.
    rebuildNode(node);
    propagateFrom(node);
    // ...and nothing repainted the battlefield, so a hand-added effect did
    // not show up until something else forced a redraw. Same three surfaces
    // pushLog() refreshes.
    renderBattle();
    renderNodeEditor();
    renderLog();
    backdrop.remove();
    openFieldEffectsModal();
  });

  // Show the side on each row of the existing-effects list, which the original
  // re-renders in place.
  const listEl = backdrop.querySelector('#fxModalList');
  if (listEl) {
    const annotate = () => {
      const fx = (getCurrentNode() || {}).snapshot.fieldEffects || [];
      listEl.querySelectorAll('.field-fx-modal-row .fx-name').forEach((el, i) => {
        if (!fx[i] || el.dataset.sideDone) return;
        el.dataset.sideDone = '1';
        if (fx[i].side) {
          const tag = document.createElement('span');
          tag.textContent = fx[i].side === 'self' ? ' · your side' : " · opponent";
          tag.style.cssText = 'opacity:.6;font-size:10px';
          el.appendChild(tag);
        }
      });
    };
    annotate();
    new MutationObserver(annotate).observe(listEl, { childList: true, subtree: true });
  }
};

/* Badges say which side an effect belongs to. */
/* Badges say which side an effect belongs to.

   Hooked onto renderBattle rather than renderAll: pushLog() redraws by calling
   renderBattle/renderNodeEditor/renderLog directly, so anything attached only
   to renderAll silently stops applying the moment an action is logged — which
   is why a badge lost its "(you)" label until the next turn. */
const __renderBattleBeforeFx = renderBattle;
renderBattle = function () {
  __renderBattleBeforeFx();
  const node = getCurrentNode();
  const fx = (node && node.snapshot.fieldEffects) || [];
  document.querySelectorAll('.field-fx-badge').forEach((el, i) => {
    const f = fx[i];
    if (!f) return;
    if (f.side) {
      el.textContent = f.name + (f.side === 'self' ? ' (you)' : ' (opp)') + ': ' + f.turns;
      el.title = (f.side === 'self' ? 'Your side' : "Opponent's side") +
                 (f.auto ? ' — set automatically' : '');
    }
    if (f.auto) el.classList.add('auto');
  });
};


/* Removing an effect from the Field dialog has to survive the rebuild, which
   re-derives inherited effects from the parent. Deleting is therefore recorded
   as a `field -Name` token rather than only splicing the array.

   Bound by delegation on the list rather than by replacing each button: the
   original's refresh() rebuilds every row from scratch (list.innerHTML = ''),
   which used to hand the delete button back to the original splice-only
   handler as soon as anything re-rendered the list — an edit, an add, or a
   previous delete. A capturing listener on the container runs before the
   button's own listener and stops it, so this stays in force across every
   refresh without re-binding. */
const __openFieldEffectsModalBeforeDelete = openFieldEffectsModal;
openFieldEffectsModal = function () {
  __openFieldEffectsModalBeforeDelete();
  const backdrop = document.querySelector('.modal-backdrop');
  const node = getCurrentNode();
  if (!backdrop || !node) return;
  const listEl = backdrop.querySelector('#fxModalList');
  if (!listEl) return;

  const rowIndex = (el) => Array.prototype.indexOf.call(
    listEl.querySelectorAll('.field-fx-modal-row'), el.closest('.field-fx-modal-row'));

  listEl.addEventListener('click', (e) => {
    const del = e.target.closest && e.target.closest('.fx-del');
    if (!del || !listEl.contains(del)) return;
    // Suppress the original handler, which only splices the array: that edit
    // does not survive a rebuild, because the effect is re-derived from the
    // parent or from the automation the next time the node is recalculated.
    e.stopPropagation();
    e.preventDefault();
    const f = (node.snapshot.fieldEffects || [])[rowIndex(del)];
    if (!f) return;
    backdrop.remove();
    pushLog({ type: 'field',
              raw: 'field -' + String(f.name).replace(/\s+/g, '_') + (f.side ? '/' + f.side : ''),
              text: f.name + ' ended.' });
  }, true);

  // Editing the turn count is a hand edit, so the effect becomes authored —
  // otherwise the automation re-derives it on the next rebuild at its old
  // count and the change is silently reverted. The original's own commit
  // handler sits on the button and has already run by the time this bubbles.
  listEl.addEventListener('click', (e) => {
    const ok = e.target.closest && e.target.closest('.fx-edit-ok');
    if (!ok || !listEl.contains(ok)) return;
    const idx = rowIndex(ok);
    const before = ((node.snapshot.fieldEffects || [])[idx] || {}).turns;
    setTimeout(() => {
      const f = (node.snapshot.fieldEffects || [])[idx];
      // Unchanged means the commit was rejected by its own validation.
      if (!f || f.turns === before) return;
      f.auto = false;
      rebuildNode(node);
      propagateFrom(node);
      renderBattle();
      renderNodeEditor();
      renderLog();
    }, 0);
  });
};

/* ---------------------------------------------------------------------
   19. Sprite ids for formes, per the rule in NOTES.md §10.

   The original builds the filename by lowercasing and turning whitespace
   into hyphens, keeping every hyphen it finds. Showdown's actual naming
   strips punctuation *within* each half and joins the two with a single
   hyphen, so anything with a two-part forme or a space came out wrong:

     Charizard-Mega-Y  ->  charizard-mega-y   (want charizard-megay)
     Great Tusk        ->  great-tusk         (want greattusk)

   Both files exist locally under the right name, so the sprite silently
   404'd, walked the whole remote fallback chain, and landed on the base
   forme — which is exactly the reported symptom: a mega-evolved Charizard
   kept showing plain Charizard art, while Froslass-Mega (one hyphen, so
   the old rule happened to agree) was fine.

   Split on the FIRST hyphen, strip everything but letters and digits from
   each half. Names whose own base contains a hyphen have to be held back
   from that split; they are a closed set, listed here. Note Aegislash-Blade
   is NOT one of them — it really is base + forme (aegislash-blade.png). */
const SPRITE_WHOLE_NAMES = new Set([
  'chiyu', 'chienpao', 'hakamoo', 'hooh', 'jangmoo', 'kommoo',
  'nidoranf', 'nidoranm', 'porygonz', 'tinglu', 'wochien',
]);
function spriteChunk(s) {
  return String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // Flabebe accents
    .toLowerCase().replace(/[^a-z0-9]/g, '');
}
function spriteId(name) {
  const raw = String(name || '').trim();
  if (!raw) return '';
  const whole = spriteChunk(raw);
  if (SPRITE_WHOLE_NAMES.has(whole)) return whole;
  const cut = raw.indexOf('-');
  if (cut <= 0) return whole;
  const base = spriteChunk(raw.slice(0, cut));
  const forme = spriteChunk(raw.slice(cut + 1));
  return forme ? base + '-' + forme : base;
}
spriteUrl = function (name) {
  const id = spriteId(name);
  return id ? SPRITES_PATH + id + '.png' : '';
};

/* The base-forme fallback strips at the first hyphen, so a mega with no art
   of its own drops all the way to the plain species. For the X/Y/Z splits
   there is usually a plain `-mega` sheet to try first — Absol-Mega-Z has no
   art (NOTES.md §10) but absol-mega.png is right there. */
document.addEventListener('error', function (e) {
  const img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.src) return;
  if (img.dataset.spriteDone || img.dataset.spriteBase || img.dataset.megaBase) return;
  const file = img.src.split('/').pop();
  const m = /^([a-z0-9]+)-mega[xyz]\.png$/i.exec(file);
  if (!m) return;
  if (parseInt(img.dataset.spriteStep || '0', 10) < SPRITE_FALLBACKS.length) return;
  img.dataset.megaBase = '1';
  img.dataset.spriteStep = '0';
  img.src = SPRITES_PATH + m[1] + '-mega.png';
}, true);


/* ---------------------------------------------------------------------
   19b. Mega evolution fires the new forme's entry ability.

   §17 gave the mega its own ability, but only the damage maths read it.
   An ability that acts the moment it appears — Mega Charizard Y's Drought,
   Mega Abomasnow's Snow Warning, Mega Tyranitar's Sand Stream, and the
   Intimidate megas — never ran, because the automation layer only fires
   entry abilities on a switch-in. In-game these do trigger on Mega
   Evolution, so the switch-in path is reused verbatim (no second copy of
   the ability table) whenever the mega actually *changes* the ability.
   Guarding on a change matters: a mega that keeps its ability must not
   re-trigger it, or Intimidate would drop the foe's Attack twice. */
const __parseTokenBeforeMegaAbility = parseAndApplyToken;
parseAndApplyToken = function (tok, snap) {
  const parts = String(tok || '').trim().split(/\s+/);
  const isMega = parts.length >= 2 && parts[1] === 'Mega';
  const slot = parts[0];
  const abilityNow = () => {
    const m = (snap.active || {})[slot];
    return toID((m && m.ability) || (state.pokemon[slot] || {}).ability || '');
  };
  const before = isMega ? abilityNow() : null;

  const out = __parseTokenBeforeMegaAbility(tok, snap);

  if (isMega && snap.active && snap.active[slot] && AutoRules.enabled()) {
    const after = abilityNow();
    if (after && after !== before) {
      AutoRules.onSwitchIn(slot, snap, (snap.autoNotes = snap.autoNotes || []));
    }
  }
  return out;
};


/* ---------------------------------------------------------------------
   18. URL import runs too early to see the wrappers above.

   `init()`'s `await maybeImportFromUrlHash()` chain (loadAssetLists() ->
   decompressRaw()'s reader.read() loop) resolves entirely through native
   promise microtasks, with no real macrotask in it. Per spec, a script's
   pending microtasks are drained in a checkpoint immediately after that
   script finishes executing — before the browser moves on to the *next*
   <script> tag. That means a #fc= URL is decoded and handed to
   importFlowchart() while it (and parseTurnLine, and every other wrapper
   in this block) still refer to the *original*, unwrapped functions:
   `[NOTE: ...]`, the `Generation:` line and field-effect `/side` suffixes
   all silently fail to parse and are left stuck in the raw tokens.
   Verified with a standalone timing harness (real CompressionStream /
   DecompressionStream): the wrapped flag was still false when
   importFlowchart ran.

   Export is unaffected — openExportUrlModal() only runs from a button
   click, long after every script tag (including this one) has executed.

   Fix: re-run the exact same boot-time import once this script has
   finished installing every wrapper above. maybeImportFromUrlHash() only
   reads location.hash (never consumes it) and importFlowchart() always
   rebuilds state from scratch, so calling it again is idempotent — the
   first, broken pass is simply overwritten by a correct one. No-op on a
   plain visit (no #fc= hash) or once IIFEs below this point stop adding
   more wrappers. */
(async function reimportUrlHashNowThatWrappersExist() {
  if (!/^#fc=/.test(location.hash || '')) return;
  await maybeImportFromUrlHash();
  renderAll();
})();

/* A build stamp, so it is possible to tell at a glance whether the page in
   front of you is the current one. Printed to the console and exposed as
   window.FLOWCHART_BUILD; the server sends no-store, but a browser that
   already cached an older copy will show its own stamp instead. */
window.FLOWCHART_BUILD = '2026-09-05 10:53';
console.log('[flowchart] build ' + window.FLOWCHART_BUILD +
  ' — field effects do not refresh on re-use; look for "was already up" in the turn notes.');

</script>

<style>
/* ---------------------------------------------------------------------
   19. The battle log must not cover the battlefield — it must squeeze it.

   Two separate problems, and the first attempt at this fixed neither.

   (a) The log can grow past the viewport. --logH / --mobileLogH are only
   clamped at drag time (setupRowSplitter's updateDrag, above); nothing
   re-clamps them on a plain resize or an orientation change, and on
   mobile .log-panel is position:fixed with an explicit height, so a
   stale oversized value paints over everything instead of squeezing it.
   Capping the *rendered* height in vh fixes that without a second resize
   listener, because the browser re-evaluates vh on every resize itself.

   (b) Even correctly sized, the battlefield never shrank — it was
   *clipped*. Measured at 1440x900 with the log dragged to 640px:
   .battle-body was 239px tall but .battle-field still laid out at its
   natural 466px and .battle-body's overflow:hidden simply cut 227px off
   the bottom, taking the whole self-side row with it. Two causes:

     * #battleContent has no CSS rule at all, so it is height:auto. That
       breaks the percentage chain — .battle-field's `height: 100%` has no
       definite parent to resolve against and falls back to its content
       height. Giving #battleContent height:100% restores it.

     * every vertical metric inside the field is a fixed px (48px top
       padding, 60px back rows, 96px field mons, the 50px middle grid
       row), so even a correctly-sized field could only clip, never
       compress.

   The fix for (b) makes .battle-body a size container and re-expresses
   those metrics as min(<the current px>, <n>cqh). Below the natural
   height nothing changes — min() picks the px — and as the log squeezes
   the panel each metric scales with the space that is actually left.
   Pure CSS, so it re-resolves on resize by itself.

   Deliberately NOT transform: scale() — the click chain (field mon →
   context menu → move → target picker) depends on real hit boxes, and a
   scaled layer would need every coordinate to be un-scaled by hand.

   Lives here rather than in themes/*.css because it must hold for every
   theme, and last in document order so it outranks the base rules and
   any theme at equal specificity.

   REGRESSION TO NOT REPEAT: the first version of this block set
   `.app { grid-template-rows: 56px auto 1fr 6px ... !important }`
   unscoped, at every width. Mobile uses a *different* row count
   (52px auto 36px 1fr — the tab bar is a row and the log/splitter are
   position:fixed, out of flow), so that override handed the 1fr row to
   #mobileTabbar (32px bar → 304px) and the 6px splitter row to .middle,
   collapsing the entire middle column to 6px. Exactly the trap in §8,
   "`.app` grid rows follow DOM order". Any .app row override MUST be
   scoped to a width range whose row count it actually matches. */

/* Desktop only — this is the 5-row template (the tab bar is display:none
   here, so the rows are header / import bar / middle / splitter / log). */
@media (min-width: 901px) {
  .app { grid-template-rows: 56px auto 1fr 6px min(var(--logH), 55vh) !important; }
}

/* Mobile keeps its own 4-row template untouched; only the fixed-position
   log and the space reserved for it are capped. */
@media (max-width: 900px) {
  .app { padding-bottom: calc(min(var(--mobileLogH), 45vh) + 26px) !important; }
  .log-panel {
    height: min(var(--mobileLogH), 45vh) !important;
    max-height: 45vh !important;
  }
  .splitter-h { bottom: calc(min(var(--mobileLogH), 45vh) + 4px) !important; }
}

/* --- the battlefield shrinks instead of being clipped ---------------- */
.battle-body {
  container-type: size;
  container-name: battlefield;
}
/* Repairs the percentage chain .battle-body → #battleContent → .battle-field. */
#battleContent { height: 100%; }

.battle-field { padding-top: min(48px, 10cqh) !important; }
.field-row-back {
  min-height: min(60px, 13cqh) !important;
  padding: min(6px, 1.5cqh) !important;
}
.field-row-back img {
  width: min(44px, 9.5cqh) !important;
  height: min(44px, 9.5cqh) !important;
}
/* min-height:0 is the load-bearing half here. .field-row-active is `flex: 1`
   inside .battle-field, but a flex item defaults to min-height:auto, so it
   refuses to shrink below its own content and the column overflows however
   small the panel gets — which is what was still cutting 30px off the
   bottom after the percentage chain was repaired. */
.field-row-active {
  grid-template-rows: 1fr min(50px, 11cqh) 1fr !important;
  min-height: 0 !important;
}
.field-row-active .opp-active,
.field-row-active .self-active { min-height: 0 !important; }

.field-mon {
  width: min(96px, 19cqh) !important;
  height: min(96px, 19cqh) !important;
}
.field-mon img {
  width: min(96px, 19cqh) !important;
  height: min(96px, 19cqh) !important;
}

/* The Winning/Losing bar is `flex: 0 0 auto` at a fixed 56px (8+36+12), so
   it kept its full height while everything above it compressed. */
.winlose-bar { padding: min(8px, 2cqh) 8px min(12px, 3cqh) 8px !important; }
.winlose-btn {
  min-height: min(36px, 9cqh) !important;
  padding: min(8px, 2cqh) 18px !important;
  font-size: min(11px, 2.6cqh) !important;
}

/* Mobile's own smaller sprites, same treatment. */
@media (max-width: 900px) {
  .field-mon, .field-mon img {
    width: min(80px, 19cqh) !important;
    height: min(80px, 19cqh) !important;
  }
  .field-row-back img {
    width: min(36px, 9.5cqh) !important;
    height: min(36px, 9.5cqh) !important;
  }
}
</style>

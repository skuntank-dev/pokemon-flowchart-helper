/* =================== EXPORT AS URL ===================
   Encodes the full flowchart text as a URL hash fragment using gzip + base64url.
   The hash never leaves the user's browser — no backend, no server, nothing
   logged anywhere. Anyone with the link decodes the same state locally on
   page load.
*/

// Convert a Uint8Array to a base64url string (URL-safe, no padding).
function bytesToBase64Url(bytes) {
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToBytes(str) {
  // Pad back to a multiple of 4 and revert URL-safe chars.
  const norm = str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice(0, (4 - str.length % 4) % 4);
  const bin = atob(norm);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function compressString(text) {
  // CompressionStream gives us native gzip on every modern browser. If it's
  // unavailable, fall back to uncompressed UTF-8 with a marker so the decoder
  // can tell the two formats apart.
  const input = new TextEncoder().encode(text);
  if (typeof CompressionStream === 'undefined') {
    return { bytes: input, compressed: false };
  }
  const cs = new CompressionStream('gzip');
  const writer = cs.writable.getWriter();
  writer.write(input);
  writer.close();
  const chunks = [];
  const reader = cs.readable.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  let total = 0;
  chunks.forEach(c => total += c.length);
  const out = new Uint8Array(total);
  let off = 0;
  chunks.forEach(c => { out.set(c, off); off += c.length; });
  return { bytes: out, compressed: true };
}

async function decompressBytes(bytes, compressed) {
  if (!compressed) return new TextDecoder().decode(bytes);
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const chunks = [];
  const reader = ds.readable.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  let total = 0;
  chunks.forEach(c => total += c.length);
  const out = new Uint8Array(total);
  let off = 0;
  chunks.forEach(c => { out.set(c, off); off += c.length; });
  return new TextDecoder().decode(out);
}

/* =================== URL ENCODING v2 ===================
   Improvements over the legacy gzip-text path (g/ prefix):
     - Use deflate-raw instead of gzip → saves the gzip 18-byte header+trailer.
     - Try brotli when available (currently only in some browsers) → ~10% better.
   Falls back gracefully through the chain: brotli → deflate-raw → gzip → none.
   The format flag in the prefix tells the decoder which algorithm to use.
   Old g/ and r/ URLs still decode via the legacy text path.
*/
async function compressRaw(bytes) {
  if (typeof CompressionStream === 'undefined') return { bytes, algo: 'none' };
  // Try brotli first (best compression), then deflate-raw, then gzip.
  for (const algo of ['brotli', 'deflate-raw', 'gzip']) {
    try {
      const cs = new CompressionStream(algo);
      const writer = cs.writable.getWriter();
      writer.write(bytes);
      writer.close();
      const chunks = [];
      const reader = cs.readable.getReader();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
      }
      let total = 0;
      chunks.forEach(c => total += c.length);
      const out = new Uint8Array(total);
      let off = 0;
      chunks.forEach(c => { out.set(c, off); off += c.length; });
      return { bytes: out, algo };
    } catch { /* try next */ }
  }
  return { bytes, algo: 'none' };
}

async function decompressRaw(bytes, algo) {
  if (algo === 'none') return bytes;
  const ds = new DecompressionStream(algo);
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const chunks = [];
  const reader = ds.readable.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  let total = 0;
  chunks.forEach(c => total += c.length);
  const out = new Uint8Array(total);
  let off = 0;
  chunks.forEach(c => { out.set(c, off); off += c.length; });
  return out;
}

async function openExportUrlModal() {
  let url;
  try {
    // Use the same text export the regular Export button produces, then
    // compress with the best algorithm available.
    const text = exportFlowchart();
    const bytes = new TextEncoder().encode(text);
    const { bytes: compressed, algo } = await compressRaw(bytes);
    const encoded = bytesToBase64Url(compressed);
    // Prefix encodes the algorithm so the decoder picks the right path.
    //   v2b/ → brotli       v2d/ → deflate-raw       v2g/ → gzip       v2n/ → none
    let prefix;
    if (algo === 'brotli')         prefix = 'v2b/';
    else if (algo === 'deflate-raw') prefix = 'v2d/';
    else if (algo === 'gzip')      prefix = 'v2g/';
    else                            prefix = 'v2n/';
    const base = location.origin + location.pathname + location.search;
    url = base + '#fc=' + prefix + encoded;
  } catch (err) {
    // Fall back to legacy gzip-text path on any error.
    try {
      const text = exportFlowchart();
      const { bytes, compressed } = await compressString(text);
      const encoded = bytesToBase64Url(bytes);
      const prefix = compressed ? 'g/' : 'r/';
      const base = location.origin + location.pathname + location.search;
      url = base + '#fc=' + prefix + encoded;
    } catch (err2) {
      alert('Failed to encode URL: ' + err2.message);
      return;
    }
  }

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h2>Export as URL</h2>
    <input type="text" id="urlInput" readonly value="">

      <button class="primary" id="urlCopyBtn">Copy</button>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  const input = backdrop.querySelector('#urlInput');
  input.value = url;
  input.select();
  backdrop.querySelector('#urlCopyBtn').addEventListener('click', () => {

// Called at boot: if the URL hash contains an encoded flowchart, decode and
// apply it as if the user pasted into the Import modal.
//
// Recognized prefixes (decoder is forward-compatible):
//   v2b/  v2d/  v2g/  v2n/  — text export + (brotli|deflate-raw|gzip|none)
//   g/    r/                — legacy text export + (gzip|none)
async function maybeImportFromUrlHash() {
  const hash = location.hash || '';
  // v2 prefixes
  const mv2 = hash.match(/^#fc=v2([bdgn])\/(.+)$/);
  if (mv2) {
    const algoMap = { b: 'brotli', d: 'deflate-raw', g: 'gzip', n: 'none' };
    const algo = algoMap[mv2[1]];
    const encoded = mv2[2];
    try {
      const compressed = base64UrlToBytes(encoded);
      const decompressed = await decompressRaw(compressed, algo);
      const text = new TextDecoder().decode(decompressed);
      importFlowchart(text);
    } catch (err) {
      console.warn('Failed to decode v2 flowchart from URL hash:', err);
    }
    return;
  }
  // Legacy prefixes
  const mLegacy = hash.match(/^#fc=([gr])\/(.+)$/);
  if (mLegacy) {
    const compressed = mLegacy[1] === 'g';
    const encoded = mLegacy[2];
    try {
      const bytes = base64UrlToBytes(encoded);
      const text = await decompressBytes(bytes, compressed);
      importFlowchart(text);
    } catch (err) {
      console.warn('Failed to decode flowchart from URL hash:', err);
    }
  }
}

/* =================== IMPORT / EXPORT TEAM =================== */
// Parse a single Showdown pokemon block (no leading prefix)
function parseShowdownBlock(blockLines) {
  const p = makeBlankPokemon();
  if (!blockLines.length) return p;
  // First line: Name (Gender) @ Item
  let first = blockLines[0].trim();
  // Strip leading slot prefix like "A: " or "1: " — caller may pass with or without
  first = first.replace(/^[A-F1-6]:\s*/, '');
  // @ Item
  const atIdx = first.lastIndexOf('@');
  if (atIdx >= 0) {
    p.item = first.slice(atIdx+1).trim();
    first = first.slice(0, atIdx).trim();
  }
  // Gender (M)/(F)
  const gm = first.match(/\(([MF])\)\s*$/);
  if (gm) {
    p.gender = gm[1];
    first = first.slice(0, gm.index).trim();
  }
  p.name = first.trim();

  let moveIdx = 0;
  for (let i = 1; i < blockLines.length; i++) {
    const ln = blockLines[i].trim();
    if (!ln) continue;
    if (/^Ability:/i.test(ln)) p.ability = ln.replace(/^Ability:\s*/i,'').trim();
    else if (/^Shiny:/i.test(ln)) p.shiny = ln.replace(/^Shiny:\s*/i,'').trim();
    else if (/^Tera Type:/i.test(ln)) p.tera = ln.replace(/^Tera Type:\s*/i,'').trim();
    else if (/^EVs:/i.test(ln)) p.evs = ln.replace(/^EVs:\s*/i,'').trim();
    else if (/^IVs:/i.test(ln)) p.ivs = ln.replace(/^IVs:\s*/i,'').trim();
    else if (/Nature\s*$/i.test(ln)) p.nature = ln.replace(/\s*Nature\s*$/i,'').trim();
    else if (/^-\s*/.test(ln) && moveIdx < 4) {
      p.moves[moveIdx++] = ln.replace(/^-\s*/,'').trim();
    }
  }
  return p;
}

function importTeamSide(side, text) {
  const slots = side === 'opp' ? SLOTS_OPP : SLOTS_SELF;
  // Split by blank lines
  const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  blocks.slice(0, 6).forEach((block, idx) => {
    const lines = block.split(/\r?\n/);
    state.pokemon[slots[idx]] = parseShowdownBlock(lines);
  });
  // New pokemon data → log text references and battle rendering both depend on
  // names/moves; rebuild every node so they're consistent.
  rebuildAllNodes();
  renderTeams();
  renderAll();
}

/* =================== EXPORT / IMPORT FLOWCHART =================== */
function exportFlowchart() {
  const lines = [];
  // Export A-F then 1-6 (only filled). Each block separated by a blank line.
  const blocks = [];
  [...SLOTS_OPP, ...SLOTS_SELF].forEach(slot => {
    const p = state.pokemon[slot];
    if (!p.name && p.moves.every(m=>!m)) return;
    const header = [];
    let h = `${slot}: ${p.name}`;
    if (p.gender) h += ` (${p.gender})`;
    if (p.item) h += ` @ ${p.item}`;
    header.push(h);
    if (p.ability) header.push(`Ability: ${p.ability}`);
    if (p.shiny) header.push(`Shiny: ${p.shiny}`);
    if (p.tera) header.push(`Tera Type: ${p.tera}`);
    if (p.evs) header.push(`EVs: ${p.evs}`);
    if (p.nature) header.push(`${p.nature} Nature`);
    if (p.ivs) header.push(`IVs: ${p.ivs}`);
    p.moves.forEach(m => { if (m) header.push(`- ${m}`); });
    blocks.push(header.join('\n'));
  });
  lines.push(blocks.join('\n\n'));
  lines.push('');
  lines.push(`On field: ${state.fieldSize}`);
  lines.push('');
  // For each turn 0 node, write its variation and chain of children for each variation
  // Order: walk in order traversal grouped by variation chain
  // We'll dump every node as "TurnN(var): tokens..."
  // Order: by turn ascending, then by variation name
  const sorted = [...state.nodes].sort((a,b) => a.turn - b.turn || a.variation.localeCompare(b.variation));
  sorted.forEach(n => {
    if (n.turn === 0) {
      const sel = n.snapshot.turn0 || {selfOrder:[], oppOrder:[]};
      const selfStr = sel.selfOrder.slice(0, state.fieldSize).join('') + (sel.selfOrder.length > state.fieldSize ? '(' + sel.selfOrder.slice(state.fieldSize).join('') + ')' : '');
      const oppStr = sel.oppOrder.slice(0, state.fieldSize).join('') + (sel.oppOrder.length > state.fieldSize ? '(' + sel.oppOrder.slice(state.fieldSize).join('') + ')' : '');
      lines.push(`Turn0(${n.variation}): ${selfStr}, ${oppStr}`);
    } else {
      const log = n.snapshot.log || [];
      // Each entry's raw token may carry a " (failed)" suffix before the comma
      // when the user has marked it as a failed attempt.
      const tokens = log.map(e => e.raw + (e.failed ? ' (failed)' : '')).join(', ');
      // Field effects: appended after the tokens, before any [WIN]/[LOSE].
      // Format: " {Name1: Turns1, Name2: Turns2}". Both inherited and
      // newly-added effects are serialized — on import the inheritance flag is
      // re-derived from parent context.
      const fx = n.snapshot.fieldEffects || [];
      let fxStr = '';
      if (fx.length > 0) {
        fxStr = ' {' + fx.map(f => `${f.name}: ${f.turns}`).join(', ') + '}';
      }
      // Terminal marker as a space-prefixed bracket suffix per spec.
      let suffix = '';
      if (n.snapshot.winLose === 'win') suffix = ' [WIN]';
      else if (n.snapshot.winLose === 'lose') suffix = ' [LOSE]';
      lines.push(`Turn${n.turn}(${n.variation}): ${tokens}${fxStr}${suffix}`);
    }
  });
  return lines.join('\n');
}

function importFlowchart(text) {
  // Reset
  [...SLOTS_SELF, ...SLOTS_OPP].forEach(s => state.pokemon[s] = makeBlankPokemon());
  state.nodes = [];
  state.currentNodeId = null;
  state.turn0Selection = { selfOrder: [], oppOrder: [] };

  const lines = text.split(/\r?\n/);
  // Split into pokemon blocks + remainder.
  // A new block starts whenever a line begins with a slot prefix like "A:" or "1:".
  // Blank lines also flush the current block (Showdown style). This dual-detection
  // makes the parser robust against malformed input that's missing blank separators.
  let blockBuffer = [];
  let mode = 'team';
  const isSlotHeader = (s) => /^[A-F1-6]:\s*\S/.test(s.trim());

  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (/^On field:/i.test(ln)) {
      flushBlock(blockBuffer);
      blockBuffer = [];
      const m = ln.match(/On field:\s*(\d+)/i);
      if (m) state.fieldSize = parseInt(m[1]) || 2;
      mode = 'turns';
      continue;
    }
    if (/^Turn\d+\(/i.test(ln)) {
      if (mode === 'team') {
        flushBlock(blockBuffer); blockBuffer = []; mode = 'turns';
      }
      parseTurnLine(ln);
      continue;
    }
    if (mode === 'team') {
      // If a slot header appears AND we already have content buffered, flush first.
      if (isSlotHeader(ln) && blockBuffer.length > 0) {
        flushBlock(blockBuffer);
        blockBuffer = [];
      }
      if (ln.trim() === '') {
        flushBlock(blockBuffer); blockBuffer = [];
      } else {
        blockBuffer.push(ln);
      }
    }
  }
  if (blockBuffer.length && mode === 'team') flushBlock(blockBuffer);

  // Make sure at least one turn 0 exists
  if (state.nodes.length === 0) createInitialNodeIfNone();
  // pick first turn0 as current
  const first0 = state.nodes.find(n => n.turn === 0);
  state.currentNodeId = first0 ? first0.id : (state.nodes[0]?.id || null);
  // Restore turn0 selection if applicable
  const cur = getCurrentNode();
  if (cur && cur.turn === 0) {
    state.turn0Selection = {
      selfOrder: [...(cur.snapshot.turn0?.selfOrder || [])],
      oppOrder: [...(cur.snapshot.turn0?.oppOrder || [])]
    };
  }
  // Final consistency pass: rebuild every turn-1+ node so their start states are
  // derived from the current set of parents and team data, not the values that
  // were live during the streaming import.
  rebuildAllNodes();
  renderAll();
}

function flushBlock(buffer) {
  if (!buffer.length) return;
  const first = buffer[0].trim();
  const m = first.match(/^([A-F1-6]):\s*/);
  if (!m) return;
  const slot = m[1];
  state.pokemon[slot] = parseShowdownBlock(buffer);
}

function parseTurnLine(line) {
  // Turn0(1): 13(24), BC(AE)  OR  TurnN(var): tokens, tokens
  const m = line.match(/^Turn(\d+)\(([^)]+)\):\s*(.*)$/i);
  if (!m) return;
  const turn = parseInt(m[1]);
  const variation = m[2];
  const rest = m[3].trim();
  if (turn === 0) {
    const parts = rest.split(',').map(p => p.trim());
    const selfPart = parts[0] || '';
    const oppPart = parts[1] || '';
    const selfOrder = parsePicks(selfPart);
    const oppOrder = parsePicks(oppPart);
    const node = {
      id: uid(), turn: 0, variation, branchTurn: 0, parentId: null,
      snapshot: { turn0: { selfOrder, oppOrder }, active: {}, field:{opp:[],self:[]}, back:{opp:[],self:[]}, log: [] }
    };
    state.nodes.push(node);
    return;
  }

  // Find parent via variation ancestry at turn-1.
  let parent = null;
  const ancestry = variationAncestry(variation);
  for (const v of ancestry) {
    parent = state.nodes.find(n => n.turn === turn - 1 && n.variation === v);
    if (parent) break;
  }
  if (!parent) {
    // last-resort fallback
    const candidates = state.nodes.filter(n => n.turn === turn - 1);
    parent = candidates[candidates.length-1];
  }
  if (!parent) return;

  const snap = deepCloneSnapshot(parent.snapshot);
  if (parent.turn === 0) {
    const sel = parent.snapshot.turn0 || {selfOrder:[], oppOrder:[]};
    const fs = state.fieldSize;
    snap.field = { self: sel.selfOrder.slice(0,fs), opp: sel.oppOrder.slice(0,fs) };
    snap.back = { self: sel.selfOrder.slice(fs), opp: sel.oppOrder.slice(fs) };
    snap.active = {};
    [...sel.selfOrder, ...sel.oppOrder].forEach(s => snap.active[s] = { hp: '100%' });
    delete snap.turn0;
  } else {
    // Legacy data from older exports may still carry pendingSwitches; drop it
    // since the new model applies switches immediately during token replay.
    delete snap.pendingSwitches;
  }
  // Parse trailing markers in reverse order: terminal first, then field effects,
  // since the format is "<tokens> {field effects} [WIN/LOSE]".
  let restClean = rest;
  let importedWinLose = null;
  const winMatch = restClean.match(/\s*\[WIN\]\s*$/i);
  const loseMatch = restClean.match(/\s*\[LOSE\]\s*$/i);
  if (winMatch) {
    importedWinLose = 'win';
    restClean = restClean.slice(0, winMatch.index).trim();
  } else if (loseMatch) {
    importedWinLose = 'lose';
    restClean = restClean.slice(0, loseMatch.index).trim();
  }
  // Field effects block: " {Name1: Turns1, Name2: Turns2}" at end of remaining
  // tokens. Match the rightmost {...} group, ignoring whitespace.
  let importedFieldEffects = null;
  const fxMatch = restClean.match(/\s*\{([^{}]*)\}\s*$/);
  if (fxMatch) {
    const inner = fxMatch[1].trim();
    if (inner.length > 0) {
      importedFieldEffects = inner.split(',').map(p => {
        const parts = p.split(':');
        if (parts.length < 2) return null;
        const name = parts[0].trim();
        const turns = parseInt(parts.slice(1).join(':').trim(), 10);
        if (!name || isNaN(turns) || turns < 1) return null;
        return { name, turns };
      }).filter(Boolean);
    } else {
      importedFieldEffects = [];
    }
    restClean = restClean.slice(0, fxMatch.index).trim();
  }
  // Strip trailing comma that may remain after removing markers
  restClean = restClean.replace(/,\s*$/, '');

  snap.log = [];
  const tokens = splitTopLevel(restClean, ',').map(s => s.trim()).filter(Boolean);
  tokens.forEach(tok => {
    // Strip optional " (failed)" suffix; mark the resulting log entry accordingly.
    let isFailed = false;
    let cleanTok = tok;
    const failMatch = cleanTok.match(/\s*\(failed\)\s*$/i);
    if (failMatch) {
      isFailed = true;
      cleanTok = cleanTok.slice(0, failMatch.index).trim();
    }
    parseAndApplyToken(cleanTok, snap);
    if (isFailed) {
      const just = snap.log[snap.log.length - 1];
      if (just) just.failed = true;
    }
  });
  if (importedWinLose) snap.winLose = importedWinLose;
  // The export format serializes field effects per turn. Absence of a {...}
  // block on a line means that turn has zero active effects — NOT "inherit
  // from parent". The deepClone above carried the parent's list across; we
  // overwrite it here unconditionally based on what the export said.
  snap.fieldEffects = (importedFieldEffects || []).map(f => ({ name: f.name, turns: f.turns }));

  // branchTurn: if parent's variation differs from this variation, this is a new branch.
  const branchTurn = (parent.variation === variation) ? parent.branchTurn : turn;

  const node = {
    id: uid(),
    turn,
    variation,
    branchTurn,
    parentId: parent.id,
    snapshot: snap
  };
  state.nodes.push(node);
}

function parsePicks(str) {
  // "13(24)" -> active [1,3], back [2,4]
  // "BC(AE)" -> active [B,C], back [A,E]
  const out = [];
  const m = str.match(/^([^()]*)(?:\(([^()]*)\))?$/);
  if (!m) return out;
  const active = (m[1]||'').split('').filter(Boolean);
  const back = (m[2]||'').split('').filter(Boolean);
  return [...active, ...back];
}

function splitTopLevel(str, sep) {
  return str.split(sep);
}

function parseAndApplyToken(tok, snap) {
  // Patterns:
  // "<slot> Mega" / "<slot> ZMove" / "<slot> Dynamax" / "<slot> Terast"
  // "<slot> health XX"
  // "<slot> switch <targetSlot>"
  // "<slot> <moveName> [targets]"
  const parts = tok.split(/\s+/);
  if (parts.length < 2) return;
  const slot = parts[0];
  const action = parts[1];
  const actorName = state.pokemon[slot]?.name || slot;

  if (['Mega','ZMove','Dynamax','Terast'].includes(action)) {
    if (snap.active[slot]) {
      if (action === 'Mega') snap.active[slot].mega = true;
      if (action === 'Dynamax') snap.active[slot].dynamax = true;
      if (action === 'Terast') snap.active[slot].terast = true;
    }
    let text = '';
    if (action === 'Mega') text = `${slot}(${actorName}) is Mega Evolving!`;
    else if (action === 'ZMove') text = `${slot}(${actorName}) is using a Z-Move!`;
    else if (action === 'Dynamax') text = `${slot}(${actorName}) is Dynamaxing!`;
    else if (action === 'Terast') text = `${slot}(${actorName}) Terastallized!`;
    snap.log.push({ type:'mechanic', raw: tok, text });
    return;
  }
  if (action === 'health') {
    const hp = parts.slice(2).join(' ');
    if (!snap.active[slot]) snap.active[slot] = {};
    snap.active[slot].hp = hp;
    snap.log.push({ type:'health', raw: tok, text: `${slot}(${actorName})'s HP is now at ${hp}.` });
    return;
  }
  if (action === 'switch') {
    const target = parts[2];
    // Immediately swap field<->back positions on the current snapshot so the
    // change is visible on the current turn's GUI. Next-turn nodes inherit
    // this already-swapped state — no pendingSwitches deferral needed.
    const isSelf = isSelfSlot(slot);
    if (snap.field && snap.back) {
      const fieldArr = isSelf ? snap.field.self : snap.field.opp;
      const backArr = isSelf ? snap.back.self : snap.back.opp;
      const fi = fieldArr.indexOf(slot);
      const bi = backArr.indexOf(target);
      if (fi >= 0 && bi >= 0) {
        fieldArr[fi] = target;
        backArr[bi] = slot;
      }
    }
    const targetName = state.pokemon[target]?.name || target;
    snap.log.push({ type:'switch', raw: tok, text: `${slot}(${actorName}) is switched out for ${target}(${targetName}).` });
    return;
  }
  // Otherwise: a move. The last contiguous slot-letters at end are targets.
  // Find trailing token that is purely [A-F1-6]+
  let moveTokens = parts.slice(1);
  let targets = [];
  const lastTok = moveTokens[moveTokens.length - 1];
  if (lastTok && /^[A-F1-6]+$/.test(lastTok)) {
    targets = lastTok.split('');
    moveTokens = moveTokens.slice(0, -1);
  }
  const moveName = moveTokens.join(' ');
  let text;
  if (targets.length === 0) {
    text = `${slot}(${actorName}) used ${moveName}.`;
  } else {
    const names = targets.map(t => `${t}(${state.pokemon[t]?.name||t})`);
    let joined;
    if (names.length === 1) joined = names[0];
    else if (names.length === 2) joined = names.join(' and ');
    else joined = names.slice(0,-1).join(', ') + ', and ' + names[names.length-1];
    text = `${slot}(${actorName}) used ${moveName} on ${joined}.`;
  }
  snap.log.push({ type:'move', raw: tok, text });
}

/* =================== THEME ===================
   The dropdown is built from whatever .css files are sitting in themes/,
   so dropping a new stylesheet in that folder adds a theme — no edit here.

   Discovery is a fetch of the directory itself. serve.py is a
   SimpleHTTPRequestHandler, which answers a directory with an HTML index we
   can scrape for hrefs. Opened straight off disk (file://) there is nothing
   to fetch, so THEME_FALLBACK carries the list instead; keep it in sync when
   adding a theme if you care about the file:// case.

   Ordering is the numeric filename prefix (00-, 10-, ...), matching the
   convention already used in js/. The prefix is stripped for display, so
   "30-brutalist-dark.css" shows up as "Brutalist-Dark".

   Nothing is persisted: reloading always lands back on Default, by design. */
const THEME_DIR = 'themes/';
const THEME_FALLBACK = [
  '00-default.css', '10-default-dark.css',
  '20-brutalist.css', '30-brutalist-dark.css',
  '40-chalkboard.css', '50-neon.css', '60-collage.css',
];

function themeLabel(file) {
  return file
    .replace(/\.css$/i, '')
    .replace(/^\d+[-_]/, '')
    .split('-')
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join('-');
}

async function listThemeFiles() {
  try {
    const res = await fetch(THEME_DIR, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const files = [...doc.querySelectorAll('a[href]')]
      .map(a => decodeURIComponent(a.getAttribute('href')).split('/').pop())
      .filter(n => /\.css$/i.test(n));
    if (!files.length) throw new Error('no stylesheets listed');
    return [...new Set(files)].sort();
  } catch (err) {
    // file://, a server without autoindex, or an empty folder.
    return THEME_FALLBACK.slice();
  }
}

(async function setupThemes() {
  const sel = document.getElementById('themeSelect');
  const link = document.getElementById('themeCss');
  if (!sel || !link) return;

  const files = await listThemeFiles();
  sel.replaceChildren(...files.map(f => {
    const o = document.createElement('option');
    o.value = f;
    o.textContent = themeLabel(f);
    return o;
  }));

  // Default = the first entry, which the 00- prefix guarantees is Default.
  const initial = files.find(f => /^0*0[-_]?default\.css$/i.test(f)) || files[0];
  if (initial) {
    sel.value = initial;
    link.href = THEME_DIR + initial;
  }

  sel.addEventListener('change', () => { link.href = THEME_DIR + sel.value; });
})();

/* =================== ZOOM ON NODE CANVAS =================== */
let canvasScale = 1;
document.getElementById('nodeCanvasWrap').addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) {

    document.getElementById('nodeCanvas').style.transform = `scale(${canvasScale})`;

/* =================== ROW RESIZE (LOG HEIGHT) =================== */
(function setupRowSplitter() {
  const root = document.documentElement;
  const sp = document.getElementById('splitterH');
  if (!sp) return;
  let dragging = false;
  let startY = 0;
  let startH = 180;
  let mobileAtStart = false;

  function beginDrag(clientY) {
    dragging = true;
    startY = clientY;
    const logPanel = document.querySelector('.log-panel');
    startH = logPanel.getBoundingClientRect().height;
    mobileAtStart = isMobile();
    sp.classList.add('dragging');
    document.body.classList.add('resizing-rows');
  }
  function updateDrag(clientY) {
    if (!dragging) return;
    const dy = clientY - startY;
    const viewportH = window.innerHeight;
    const minLog = mobileAtStart ? 90 : 60;
    const maxLog = viewportH - (mobileAtStart ? 180 : 286);
    let newH = startH - dy;
    newH = Math.max(minLog, Math.min(maxLog, newH));
    root.style.setProperty(mobileAtStart ? '--mobileLogH' : '--logH', newH + 'px');
  }
  function endDrag() {
    if (dragging) {
      dragging = false;
      sp.classList.remove('dragging');
      document.body.classList.remove('resizing-rows');
    }
  }

  // Mouse
  sp.addEventListener('mousedown', (e) => {
    e.preventDefault();
    beginDrag(e.clientY);
  });
  document.addEventListener('mousemove', (e) => { if (dragging) updateDrag(e.clientY); });
  document.addEventListener('mouseup', endDrag);

  // Touch — dedicated handlers, not synthesized mouse events
  sp.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    e.preventDefault();
    beginDrag(e.touches[0].clientY);
  }, { passive: false });
  sp.addEventListener('touchmove', (e) => {
    if (!dragging || e.touches.length !== 1) return;
    e.preventDefault();
    updateDrag(e.touches[0].clientY);
  }, { passive: false });
  // Also listen on document so that finger leaving the splitter still tracks
  document.addEventListener('touchmove', (e) => {
    if (!dragging || e.touches.length !== 1) return;
    e.preventDefault();
    updateDrag(e.touches[0].clientY);
  }, { passive: false });
  document.addEventListener('touchend', endDrag);
  document.addEventListener('touchcancel', endDrag);
})();

/* =================== COLUMN RESIZE =================== */
(function setupSplitters() {
  const root = document.documentElement;
  const middle = document.querySelector('.middle');
  let dragging = null;
  let startX = 0;
  let startCol1 = 360;
  let startCol3 = 380;

  function getColVar(name, fallback) {
    const cs = getComputedStyle(root).getPropertyValue(name).trim();
    const n = parseFloat(cs);
    return isNaN(n) ? fallback : n;
  }

  document.querySelectorAll('.splitter').forEach(sp => {
    sp.addEventListener('mousedown', (e) => {
      e.preventDefault();
      dragging = sp;
      startX = e.clientX;
      const mr = middle.getBoundingClientRect();
      // Read current pixel widths of the side panels rather than CSS vars
      // (so the splitter starts from wherever the user last left it).
      const panels = middle.querySelectorAll(':scope > .panel');
      startCol1 = panels[0].getBoundingClientRect().width;
      startCol3 = panels[2].getBoundingClientRect().width;
      sp.classList.add('dragging');
      document.body.classList.add('resizing-cols');
    });
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const middleWidth = middle.getBoundingClientRect().width;
    const dx = e.clientX - startX;
    const minSide = 220;
    const minMiddle = 260;
    if (dragging.id === 'splitter1') {
      let newCol1 = startCol1 + dx;
      newCol1 = Math.max(minSide, newCol1);
      // ensure middle column keeps at least minMiddle
      const maxCol1 = middleWidth - startCol3 - minMiddle - 12;
      newCol1 = Math.min(newCol1, maxCol1);
      root.style.setProperty('--col1', newCol1 + 'px');
    } else if (dragging.id === 'splitter2') {
      let newCol3 = startCol3 - dx;
      newCol3 = Math.max(minSide, newCol3);
      const maxCol3 = middleWidth - startCol1 - minMiddle - 12;
      newCol3 = Math.min(newCol3, maxCol3);
      root.style.setProperty('--col3', newCol3 + 'px');
    }
    // re-render the node editor since canvas width changed
    renderNodeEditor();
  });

  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging.classList.remove('dragging');
      dragging = null;
      document.body.classList.remove('resizing-cols');
    }
  });
})();

/* =================== MOBILE SUPPORT =================== */
const MOBILE_BREAKPOINT = 900;
function isMobile() { return window.innerWidth <= MOBILE_BREAKPOINT; }

// Mobile tab bar — controls which panel is visible on small screens.

/* =================== TOUCH: TAP TOOLTIPS =================== */
// Replace hover-based tooltips with tap-toggled bottom-sheet on touch devices.
// We detect touch in attachHoverTooltip and adjust behavior.
let activeTouchTooltip = null;
function dismissTouchTooltip() {

/* =================== PINCH ZOOM ON NODE CANVAS =================== */
(function setupPinchZoom() {
  const wrap = document.getElementById('nodeCanvasWrap');
  const canvas = document.getElementById('nodeCanvas');
  if (!wrap || !canvas) return;
  let pinchStartDist = 0;
  let pinchStartScale = 1;
  let lastTouchTime = 0;

  function dist(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  wrap.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartScale = canvasScale;
    }
    lastTouchTime = Date.now();
  }, { passive: false });

  wrap.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStartDist > 0) {
      e.preventDefault();
      const d = dist(e.touches[0], e.touches[1]);
      const factor = d / pinchStartDist;
      canvasScale = Math.min(2, Math.max(0.4, pinchStartScale * factor));
      canvas.style.transform = `scale(${canvasScale})`;
    }
  }, { passive: false });

  wrap.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) pinchStartDist = 0;
  });
})();

/* =================== TOUCH SUPPORT FOR COLUMN SPLITTERS =================== */
// Column splitters (between desktop columns) are mouse-only by design but tablets
// >900px wide should still be able to drag them by touch. Synthesize mouse events
// from touch on the column splitters only (the row splitter has its own native
// touch handlers above).
(function addTouchToSplitters() {
  const fire = (target, type, touch) => {
    const evt = new MouseEvent(type, {
      bubbles: true, cancelable: true,
      clientX: touch.clientX, clientY: touch.clientY,
      button: 0
    });
    target.dispatchEvent(evt);
  };
  document.querySelectorAll('.splitter').forEach(sp => {
    sp.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      e.preventDefault();
      fire(sp, 'mousedown', e.touches[0]);
    }, { passive: false });
  });
  document.addEventListener('touchmove', (e) => {
    if (document.body.classList.contains('resizing-cols')) {
      if (e.touches.length === 1) {
        e.preventDefault();
        fire(document, 'mousemove', e.touches[0]);
      }
    }
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    if (document.body.classList.contains('resizing-cols')) {
      fire(document, 'mouseup', e.changedTouches[0] || { clientX:0, clientY:0 });
    }
  });
})();

/* =================== RENDER ALL =================== */
function renderAll() {
  renderTeams();
  renderBattle();
  renderNodeEditor();
  renderLog();
}

/* =================== BOOT =================== */

  await maybeImportFromUrlHash();
  renderAll();
})();

<script>
/* =====================================================================

   Everything above this line is the original application, unedited.

/* ---------------------------------------------------------------------

var ABILITY_LIST = [], ITEM_LIST = [], NATURE_LIST = [], TYPE_LIST = [];


/* ---------------------------------------------------------------------
   2. Sprites.

   as-is. Anything missing (the newest Champions megas, which Showdown
   itself 404s under home/) falls back through its other directories and

   --------------------------------------------------------------------- */
const SPRITE_FALLBACKS = [
  'https://play.pokemonshowdown.com/sprites/home/',
  'https://play.pokemonshowdown.com/sprites/dex/',
  'https://play.pokemonshowdown.com/sprites/gen5/',
];
document.addEventListener('error', function (e) {
  const img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.src) return;
  if (img.dataset.spriteDone) return;
  const file = img.src.split('/').pop();
  if (!/\.png$/i.test(file)) return;
  let step = parseInt(img.dataset.spriteStep || '0', 10);
  if (step < SPRITE_FALLBACKS.length) {
    img.dataset.spriteStep = String(step + 1);
    img.src = SPRITE_FALLBACKS[step] + file;
    return;
  }
  const base = file.indexOf('-') > 0 ? file.slice(0, file.indexOf('-')) + '.png' : null;
  if (base && !img.dataset.spriteBase) {
    img.dataset.spriteBase = '1';
    img.dataset.spriteStep = '0';

/* ---------------------------------------------------------------------
   3. Automation hooks in the rebuild pipeline.
   Wrapped, not rewritten: the original derives the start-of-turn state,
   then the additions let entry abilities fire on the leads and drop
   anything that only lasts a turn.
   --------------------------------------------------------------------- */
const __origBuildStartSnapshot = buildStartSnapshot;
buildStartSnapshot = function (node) {
  const snap = __origBuildStartSnapshot(node);
  snap.autoNotes = [];
  if (node.turn > 0) {
    // The original starts each turn with an empty effect list and re-attaches
    // the node's own afterwards. That hid still-running effects from the
    // actions being replayed, so using Tailwind on a later turn could not tell
    // that Tailwind was already up — and restarted its timer.
    // Seeding here instead means the turn begins in the state it really is in.
    const parent = findParentForArrow(node);
    const seeded = [];
    const put = f => {
      const dup = seeded.some(x => toID(x.name) === toID(f.name) &&
                                   (x.side || null) === (f.side || null));
      if (!dup) seeded.push(f);
    };
    if (parent && parent.turn > 0) {
      (parent.snapshot.fieldEffects || [])
        .filter(f => f.hazard || f.turns > 1)
        .forEach(f => put(fxNormalise(Object.assign({}, f,
          { turns: f.hazard ? f.turns : f.turns - 1 }))));
    }
    // Hand-entered effects belong to this turn and are seeded alongside, so a
    // delete recorded in the log can remove them like anything else.
    (node.__manualFx || []).forEach(f => put(fxNormalise(Object.assign({}, f))));
    snap.fieldEffects = fxEnforceExclusive(seeded);

    AutoRules.clearTransient(snap);
    if (parent && parent.turn === 0) {
      // Turn 1: the leads are arriving now, so their abilities fire.
      [].concat(snap.field.self || [], snap.field.opp || [])
        .forEach(sl => AutoRules.onSwitchIn(sl, snap, snap.autoNotes));
    }
  }

};

/* ---------------------------------------------------------------------
   4. Token application.
   Replaces the original so it can (a) recognise the added verbs that carry
   what the old grammar could not express, and (b) let the automation layer
   react. The move / switch / health / mechanic tokens behave exactly as
   before.
   --------------------------------------------------------------------- */
function parseAndApplyToken(tok, snap) {
  const notes = (snap.autoNotes = snap.autoNotes || []);
  const parts = tok.split(/\s+/);
  if (parts.length < 2) return;
  const slot = parts[0];
  const action = parts[1];
  const actorName = (state.pokemon[slot] && state.pokemon[slot].name) || slot;

  /* --- added verbs -------------------------------------------------- */
  if (slot === 'field') {
    // "field Trick_Room 5" / "field Reflect/self 5" / "field -Tailwind/self"
    const rest = tok.slice(6).trim();
    const rm = rest.startsWith('-');
    const body = rm ? rest.slice(1) : rest;
    const bits = body.split(/\s+/);
    const nameSide = bits[0].split('/');
    const name = nameSide[0].replace(/_/g, ' ');
    const side = nameSide[1] || null;
    const turns = parseInt(String(bits[1] || '').replace(/^t/, ''), 10) || 5;
    if (rm) {
      AutoRules.removeEffect(snap, f => toID(f.name) === toID(name) && (f.side || null) === side);
      snap.log.push({ type:'field', raw: tok, text: `${name} ended.` });
    } else {
      const kind = Calc.mapWeather(name) ? 'weather' : Calc.mapTerrain(name) ? 'terrain' : null;
      if (kind) AutoRules.setExclusive(snap, kind, name, turns);
      else AutoRules.addEffect(snap, name, turns, side);
      snap.log.push({ type:'field', raw: tok,
        text: `${name} started${side ? ' on ' + (side === 'self' ? 'your side' : "the opponent's side") : ''}.` });
    }
    return;
  }

  if (action === 'boost') {
    const ms = (snap.active[slot] = snap.active[slot] || { hp: '100%' });
    ms.boosts = ms.boosts || {};
    const arg = parts.slice(2).join(' ');
    if (arg === 'reset') {
      if (slot === '*') Object.keys(snap.active).forEach(s => { snap.active[s].boosts = {}; });
      else ms.boosts = {};
      snap.log.push({ type:'boost', raw: tok, text: `${slot}(${actorName}) had stat changes reset.` });
      return;
    }
    const shown = [];
    arg.split(',').forEach(piece => {
      const m = piece.trim().match(/^([a-z]+)([=+-])(-?\d+)$/i);
      if (!m) return;
      const k = m[1], op = m[2], v = parseInt(m[3], 10);
      const before = ms.boosts[k] || 0;
      ms.boosts[k] = clamp(op === '=' ? v : (op === '-' ? before - Math.abs(v) : before + v), -6, 6);
      const nm = k === 'acc' ? 'Acc' : k === 'eva' ? 'Eva' : calc.Stats.displayStat(k);
      const d = ms.boosts[k] - before;
      if (d) shown.push((d > 0 ? '+' : '') + d + ' ' + nm);
    });
    snap.log.push({ type:'boost', raw: tok,
      text: `${slot}(${actorName}): ${shown.join(', ') || 'no change'}.` });
    return;
  }

  if (action === 'status') {
    const ms = (snap.active[slot] = snap.active[slot] || { hp: '100%' });
    const v = parts[2] || 'none';
    ms.status = (v === 'none') ? null : v;
    const words = { brn:'burned', par:'paralyzed', slp:'put to sleep', frz:'frozen',
                    psn:'poisoned', tox:'badly poisoned' };
    snap.log.push({ type:'status', raw: tok,
      text: v === 'none' ? `${slot}(${actorName}) recovered from its status.`
                         : `${slot}(${actorName}) was ${words[v] || v}.` });
    return;
  }

  if (action === 'item') {
    const ms = (snap.active[slot] = snap.active[slot] || { hp: '100%' });
    ms.itemUsed = true;
    snap.log.push({ type:'item', raw: tok, text: `${slot}(${actorName}) used up its item.` });
    return;
  }

  /* --- original verbs, unchanged in behaviour ------------------------ */
  if (['Mega','ZMove','Dynamax','Terast'].includes(action)) {
    if (snap.active[slot]) {
      if (action === 'Mega') {
        snap.active[slot].mega = true;
        const forme = Dex.megaEvolution(snap.active[slot].species || actorName,
          snap.active[slot].item || (state.pokemon[slot] || {}).item);
        if (forme) {
          snap.active[slot].species = forme;
          // A mega forme has exactly one ability (no hidden-ability slot) and
          // it usually isn't the base forme's — Mega Charizard Y is Drought,
          // not Blaze. Damage calc reads snap.active[slot].ability first
          // (see Calc.buildPokemon), so leaving this unset silently kept
          // computing damage with the pre-mega ability.
          const megaAbility = (Dex.species(forme) || {}).abilities;
          if (megaAbility && megaAbility[0]) snap.active[slot].ability = megaAbility[0];
        }
      }
      if (action === 'Dynamax') snap.active[slot].dynamax = true;
      if (action === 'Terast') snap.active[slot].terast = true;
    }
    const t = { Mega:'is Mega Evolving!', ZMove:'is using a Z-Move!',
                Dynamax:'is Dynamaxing!', Terast:'Terastallized!' }[action];
    snap.log.push({ type:'mechanic', raw: tok, text: `${slot}(${actorName}) ${t}` });
    return;
  }

  if (action === 'health') {
    const hp = parts.slice(2).join(' ');
    if (!snap.active[slot]) snap.active[slot] = {};
    snap.active[slot].hp = hp;
    snap.log.push({ type:'health', raw: tok, text: `${slot}(${actorName})'s HP is now at ${hp}.` });
    if (AutoRules.enabled()) AutoRules.checkItems(snap, slot, notes);
    return;
  }

  if (action === 'switch') {
    const target = parts[2];
    const isSelf = isSelfSlot(slot);
    if (snap.field && snap.back) {
      const fieldArr = isSelf ? snap.field.self : snap.field.opp;
      const backArr = isSelf ? snap.back.self : snap.back.opp;
      const fi = fieldArr.indexOf(slot);
      const bi = backArr.indexOf(target);
      if (fi >= 0 && bi >= 0) { fieldArr[fi] = target; backArr[bi] = slot; }
    }
    // Whatever left the field loses its stat changes.
    if (snap.active[slot]) { snap.active[slot].boosts = {}; delete snap.active[slot].protected; }
    const targetName = (state.pokemon[target] && state.pokemon[target].name) || target;
    snap.log.push({ type:'switch', raw: tok,
      text: `${slot}(${actorName}) is switched out for ${target}(${targetName}).` });
    if (AutoRules.enabled()) AutoRules.onSwitchIn(target, snap, notes);
    return;
  }

  // Otherwise a move. Trailing slot letters are the targets.
  let moveTokens = parts.slice(1);
  let targets = [];
  const lastTok = moveTokens[moveTokens.length - 1];
  if (lastTok && /^[A-F1-6]+$/.test(lastTok)) {
    targets = lastTok.split('');
    moveTokens = moveTokens.slice(0, -1);
  }
  const moveName = moveTokens.join(' ');
  let text;
  if (targets.length === 0) text = `${slot}(${actorName}) used ${moveName}.`;
  else {
    const names = targets.map(t => `${t}(${(state.pokemon[t] || {}).name || t})`);
    text = `${slot}(${actorName}) used ${moveName} on ${joinNames(names)}.`;
  }
  snap.log.push({ type:'move', raw: tok, text });
  if (AutoRules.enabled()) AutoRules.onMoveUsed(slot, moveName, targets, snap, notes);
}

/* ---------------------------------------------------------------------
   5. Damage.
   The move itself is logged exactly as before. What the automation adds is
   the HP bookkeeping that used to be manual: after choosing targets, a
   modal offers the 16 damage rolls, and confirming writes ordinary
   `health` lines — one per target, on their own lines in the log, the same
   entries the user could have typed. They can be edited, reordered or
   deleted like any other action.
   --------------------------------------------------------------------- */

function pushLogs(entries) {
  const node = getCurrentNode();
  if (!node || node.snapshot.winLose) return;
  const log = ensureLogArray();
  entries.forEach(e => log.push(e));
  rebuildNode(node);
  propagateFrom(node);
  renderBattle(); renderNodeEditor(); renderLog();
}

function commitMove(actorSlot, moveName, targets) {
  const actorName = state.pokemon[actorSlot].name || actorSlot;
  const names = targets.map(t => `${t}(${(state.pokemon[t] || {}).name || t})`);
  const text = targets.length
    ? `${actorSlot}(${actorName}) used ${moveName} on ${joinNames(names)}.`
    : `${actorSlot}(${actorName}) used ${moveName}.`;
  const raw = `${actorSlot} ${moveName}${targets.length ? ' ' + targets.join('') : ''}`;
  const moveEntry = { type: 'move', raw, text };

  const node = getCurrentNode();
  const snap = node && node.snapshot;
  if (!snap || !targets.length || !AutoRules.enabled()) { pushLog(moveEntry); return; }

  // Work out what this move would do, from the state as it stands right now.
  const results = [];
  targets.forEach(t => {
    // hitCount is how many Pokemon this move actually hits, which is what
    // decides whether the 0.75x spread reduction applies (lib-30-calc.js).
    const r = Calc.run(actorSlot, moveName, t, snap, { hitCount: targets.length });
    if (r && r.rolls.length) results.push({ slot: t, r, roll: Calc.DEFAULT_ROLL,
                                            crit: false, hitCount: targets.length });
  });
  if (!results.length) { pushLog(moveEntry); return; }   // status move, or no data

  openDamageModal(actorSlot, moveName, results, snap, chosen => {
    const entries = [moveEntry];
    chosen.forEach(c => {
      const before = hpPctOf(snap, c.slot);
      const dealtPct = c.r.pct[Calc.rollIndexFor(c.r, c.roll)];
      const after = hpPctString(Math.max(0, before - dealtPct));
      const nm = (state.pokemon[c.slot] || {}).name || c.slot;
      entries.push({ type: 'health', raw: `${c.slot} health ${after}`,
                     text: `${c.slot}(${nm})'s HP is now at ${after}.` });
    });
    pushLogs(entries);
  });
}

function openDamageModal(actorSlot, moveName, results, snap, onConfirm) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal" style="max-width:min(94vw,620px)">
    <h2>${escapeHtml(actorSlot)} → ${escapeHtml(moveName)}</h2>
    <div style="font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-bottom:10px;">
      Pick the damage roll for each target. The average roll is already selected —
      just press Apply to take it.</div>
    <div id="dmgBody"></div>
    <div class="modal-actions">
      <button id="dmgSkip">No damage</button>
      <button class="primary" id="dmgOk">Apply</button>
    </div></div>`;
  document.body.appendChild(backdrop);

  const body = backdrop.querySelector('#dmgBody');
  const draw = () => {
    body.innerHTML = '';
    results.forEach((c, i) => {
      const p = state.pokemon[c.slot] || {};
      const before = hpPctOf(snap, c.slot);
      const idx = Calc.rollIndexFor(c.r, c.roll);
      const dealtPct = c.r.pct[idx];
      const after = Math.max(0, before - dealtPct);

      const box = document.createElement('div');
      box.className = 'dmg-block';
      box.innerHTML =
        `<div class="dmg-head">
           <img src="${spriteUrl((snap.active[c.slot] || {}).species || p.name)}" alt="">
           <span><b>${escapeHtml(c.slot)}: ${escapeHtml(p.name || '')}</b> — at ${hpPctString(before)}</span>
         </div>
         ${estimateWarn(actorSlot, c.slot)}
         <div class="calc-desc">${escapeHtml(c.r.desc || '')}</div>
         ${c.r.ko ? `<div class="calc-ko">${escapeHtml(c.r.ko)}</div>` : ''}
         <div class="roll-strip">${c.r.rolls.map((d, j) =>
           `<div class="roll-cell${j === idx ? ' sel' : ''}" data-i="${i}" data-j="${j}"
              title="${d} HP">${c.r.pct[j].toFixed(0)}</div>`).join('')}</div>
         <div class="roll-presets">
           ${Calc.ROLL_PRESETS.map(pr =>
             `<button data-i="${i}" data-roll="${pr.idx}" class="${idx === pr.idx ? 'sel' : ''}">${pr.label}</button>`).join('')}
           <button data-i="${i}" data-crit="1" class="${c.crit ? 'sel' : ''}">Crit</button>
         </div>
         <div class="calc-outcome">Deals ${dealtPct.toFixed(1)}% →
           leaves <b>${hpPctString(after)}</b>${after <= 0 ? ' — <b>faints</b>' : ''}</div>`;
      body.appendChild(box);
    });

    body.querySelectorAll('.roll-cell').forEach(el => el.addEventListener('click', () => {
      results[+el.dataset.i].roll = +el.dataset.j; draw();
    }));
    body.querySelectorAll('[data-roll]').forEach(el => el.addEventListener('click', () => {
      results[+el.dataset.i].roll = +el.dataset.roll; draw();
    }));
    body.querySelectorAll('[data-crit]').forEach(el => el.addEventListener('click', () => {
      const c = results[+el.dataset.i];
      c.crit = !c.crit;
      // Carry the same hit count, or the crit re-roll would disagree with the
      // number that was already on screen.
      const again = Calc.run(actorSlot, moveName, c.slot, snap,
                             { isCrit: c.crit, hitCount: c.hitCount });
      if (again && again.rolls.length) c.r = again;
      draw();
    }));
  };

  const estimateWarn = (a, d) => {
    const miss = [a, d].filter(s => !parseStatSpread((state.pokemon[s] || {}).evs))
                       .map(s => (state.pokemon[s] || {}).name || s);
    if (!miss.length) return '';
    return `<div class="estimate-warn">Estimate only — no ${state.gen === 0 ? 'stat points' : 'EVs'}
      known for ${escapeHtml(miss.join(' or '))}. Replays never include them; import the
      team's pokepaste to make this exact.</div>`;
  };

  draw();
  backdrop.querySelector('#dmgSkip').addEventListener('click', () => { backdrop.remove(); onConfirm([]); });
  backdrop.querySelector('#dmgOk').addEventListener('click', () => { backdrop.remove(); onConfirm(results); });
}

/* ---------------------------------------------------------------------
   6. Node notes.
   A third entry between Go To and Delete. The note is drawn on the node
   under the variation label. It lives on the node rather than the snapshot
   because snapshots are rebuilt from scratch on every propagation.
   --------------------------------------------------------------------- */
function showNodeContextMenu(evt, nodeId) {
  closeAllContextMenus();
  const node = state.nodes.find(n => n.id === nodeId);
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  if (isMobile()) {
    const backdrop = document.createElement('div');
    backdrop.className = 'mobile-ctx-backdrop';
    backdrop.addEventListener('click', closeAllContextMenus);
    document.body.appendChild(backdrop);
    menu.style.left = '50%'; menu.style.top = '50%';
    menu.style.transform = 'translate(-50%, -50%)';
    menu.style.width = 'min(86vw, 280px)';
  } else {
    menu.style.left = evt.clientX + 'px';
    menu.style.top = evt.clientY + 'px';
  }
  const has = !!((node && node.notes) || '').trim();
  menu.innerHTML = `
    <div class="item" data-act="goto">Go To</div>
    <div class="item" data-act="notes">Notes${has ? '' : '…'}</div>
    <div class="item" data-act="delete">Delete</div>
  `;
  document.body.appendChild(menu);
  menu.querySelectorAll('.item').forEach(it => {
    it.addEventListener('click', () => {
      const act = it.dataset.act;
      closeAllContextMenus();
      if (act === 'goto') goToNode(nodeId);
      else if (act === 'notes') openNodeNotes(nodeId);
      else if (act === 'delete') deleteNode(nodeId);
    });
  });
}

function openNodeNotes(nodeId) {
  const node = state.nodes.find(n => n.id === nodeId);
  if (!node) return;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h2>Notes — Turn ${node.turn} · ${escapeHtml(node.variation)}</h2>
    <textarea id="noteField" spellcheck="false">${escapeHtml(node.notes || '')}</textarea>
    <div class="modal-actions">
      <button id="noteClear">Clear</button>
      <button id="noteCancel">Cancel</button>
      <button class="primary" id="noteSave">Save</button>
    </div></div>`;
  document.body.appendChild(backdrop);
  const field = backdrop.querySelector('#noteField');
  field.focus();
  backdrop.querySelector('#noteCancel').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('#noteClear').addEventListener('click', () => {
    node.notes = ''; backdrop.remove(); renderNodeEditor();
  });
  backdrop.querySelector('#noteSave').addEventListener('click', () => {
    node.notes = field.value.trim(); backdrop.remove(); renderNodeEditor();
  });
}

/* Drawn after the original render, so the node layout code is untouched. */
const __origRenderNodeEditor = renderNodeEditor;
renderNodeEditor = function () {
  __origRenderNodeEditor();
  const canvas = document.getElementById('nodeCanvas');
  if (!canvas) return;
  state.nodes.forEach(n => {
    const note = (n.notes || '').trim();
    if (!note) return;
    const el = [...canvas.querySelectorAll('.node')].find(d => {
      const t = d.querySelector('.node-turn'), v = d.querySelector('.node-var');
      return t && v && t.textContent === 'Turn ' + n.turn &&
             v.textContent.replace(/\s*\(50\/50\)\s*$/, '') === n.variation;
    });
    if (!el || el.classList.contains('terminal')) return;
    const div = document.createElement('div');
    div.className = 'node-note';
    div.title = note;
    div.textContent = note;
    el.appendChild(div);
    el.style.height = 'auto';
  });
};

/* ---------------------------------------------------------------------
   7. Export / import.
   The file format keeps its exact shape. Two additions ride along in the
   existing style: a field effect's side is written into its name as
   "Reflect/self", and a node note becomes a trailing "[NOTE: ...]" marker
   next to the existing [WIN] / [LOSE] ones. Files without either still
   load, and the Import / Export dialogs are unchanged.
   --------------------------------------------------------------------- */
const __origExportFlowchart = exportFlowchart;
exportFlowchart = function () {
  const text = __origExportFlowchart();
  // Re-emit the per-node lines with the two extra pieces of information.
  return text.split('\n').map(line => {
    const m = line.match(/^Turn(\d+)\(([^)]+)\):/);
    if (!m) return line;
    const turn = parseInt(m[1], 10), variation = m[2];
    const node = state.nodes.find(n => n.turn === turn && n.variation === variation);
    if (!node) return line;
    let out = line;
    // Field effect sides.
    const fx = node.snapshot.fieldEffects || [];
    if (fx.length) {
      const withSide = ' {' + fx.map(f =>
        `${f.name}${f.side ? '/' + f.side : ''}: ${f.turns}`).join(', ') + '}';
      out = out.replace(/\s*\{[^{}]*\}/, withSide);
    }
    const note = (node.notes || '').trim();
    if (note) out += ' [NOTE: ' + note.replace(/\r?\n/g, '\\n') + ']';
    return out;
  }).join('\n');
};

const __origParseTurnLine = parseTurnLine;
parseTurnLine = function (line) {
  let note = '';
  const m = line.match(/\s*\[NOTE:\s*([\s\S]*?)\]\s*$/);
  if (m) { note = m[1].replace(/\\n/g, '\n'); line = line.slice(0, m.index); }
  const before = state.nodes.length;
  __origParseTurnLine(line);
  if (state.nodes.length > before) {
    const n = state.nodes[state.nodes.length - 1];
    if (note) n.notes = note;
    (n.snapshot.fieldEffects || []).forEach(f => {
      const i = String(f.name).indexOf('/');
      if (i > 0) { f.side = f.name.slice(i + 1); f.name = f.name.slice(0, i); }
    });
  }
};

   8. Import bar.
   --------------------------------------------------------------------- */
let importAsP2 = false;

}

function openGenPicker() {

  backdrop.innerHTML = `<div class="modal"><h2>Calculator generation</h2>

async function doImport(url) {
  if (!url) { toast('Paste a replay or pokepaste link first.', 'warn'); return; }
  const bar = document.querySelector('.import-bar');
  bar.classList.add('busy');
  try {
    if (PasteImport.isPokepasteUrl(url)) await importPokepasteUrl(url);
    else await importReplayUrl(url);
  } catch (e) {
    toast('Import failed: ' + (e && e.message ? e.message : e), 'bad');
  } finally { bar.classList.remove('busy'); }
}

async function importReplayUrl(url) {
  toast('Fetching replay…');
  const data = await ReplayImport.fetchReplay(url);
  const parsed = ReplayImport.parseLog(data);
  parsed.id = data.id;
  const res = Apply.replay(parsed, { flip: importAsP2 });
  refreshDexLists();
  renderAll();
  toast('Imported ' + res.turns + ' turns — ' + (parsed.players || []).join(' vs ') +
        ' (' + GenDetect.label(state.gen) + ').', 'good');
  const anySpread = [...SLOTS_SELF, ...SLOTS_OPP].some(s => parseStatSpread(state.pokemon[s].evs));
  if (!anySpread) offerPasteMerge();
}

/* Replays never carry EVs — not even with open team sheets. Without them the
   damage numbers are estimates, so this is offered straight away rather than
   letting it be discovered later. */
function offerPasteMerge() {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h2>Add the teams' spreads?</h2>
    <div style="font-family:var(--mono);font-size:12px;line-height:1.65">
      Showdown replays never include EVs or stat points, even with open team
      sheets. Without them the damage numbers are estimates.<br><br>
      Paste a pokepast.es link for either team — spreads, natures, items and
      abilities are merged in by species, so slot order does not have to match.
      <input id="mergeUrl" type="text" placeholder="https://pokepast.es/…"
        style="width:100%;margin-top:10px;padding:6px;border:1px solid var(--line);
               border-radius:4px;background:var(--bg-1);color:var(--ink);
               font-family:var(--mono);font-size:12px"></div>
    <div class="modal-actions">
      <button id="mgSkip">Skip</button>
      <button class="primary" id="mgGo">Merge</button>
    </div></div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#mgSkip').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('#mgGo').addEventListener('click', async () => {
    const u = backdrop.querySelector('#mergeUrl').value.trim();
    if (!u) return;
    backdrop.remove();
    try { await mergePokepaste(u); } catch (e) { toast('Merge failed: ' + e.message, 'bad'); }
  });
}

async function mergePokepaste(url) {
  toast('Fetching pokepaste…');
  const paste = await PasteImport.fetchPokepaste(url);
  const { hits, missed } = Apply.mergeSets(paste.sets);
  const g = GenDetect.fromNotes(paste.notes);
  if (g && state.genWeak) Apply.maybeSetGen(g);
  refreshDexLists();
  rebuildAllNodes();
  renderAll();
  toast('Merged ' + hits + ' set' + (hits === 1 ? '' : 's') + ' from "' +
        (paste.title || 'pokepaste') + '"' +
        (missed.length ? ' — unmatched: ' + missed.join(', ') : '') + '.',
        hits ? 'good' : 'warn');
}

async function importPokepasteUrl(url) {
  toast('Fetching pokepaste…');
  const paste = await PasteImport.fetchPokepaste(url);
  if (!paste.sets.length) throw new Error('that paste contained no readable sets');
  const haveTeams = [...SLOTS_SELF, ...SLOTS_OPP].some(s => state.pokemon[s].name);
  if (!haveTeams) { Apply.pasteToSide(paste, 'self'); refreshDexLists(); renderAll();
                    toast('Loaded "' + (paste.title || 'pokepaste') + '" into 1-6.', 'good'); return; }

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h2>${escapeHtml(paste.title || 'pokepaste')}</h2>
    <div style="font-family:var(--mono);font-size:12px;line-height:1.65">
      ${paste.sets.length} set${paste.sets.length === 1 ? '' : 's'}
      ${paste.author ? 'by ' + escapeHtml(paste.author) : ''}.
      ${paste.notes ? '<br><span style="opacity:.7">' + escapeHtml(paste.notes) + '</span>' : ''}
      <br><br>Merge into the existing teams by species, or replace one side?</div>
    <div class="modal-actions">
      <button id="ppCancel">Cancel</button>
      <button id="ppOpp">Replace A-F</button>
      <button id="ppSelf">Replace 1-6</button>
      <button class="primary" id="ppMerge">Merge by species</button>
    </div></div>`;
  document.body.appendChild(backdrop);
  const done = (msg) => { backdrop.remove(); refreshDexLists(); renderAll(); toast(msg, 'good'); };
  backdrop.querySelector('#ppCancel').addEventListener('click', () => backdrop.remove());

/* ---------------------------------------------------------------------
   11. Field effects across a rebuild.
   The original preserved the whole list verbatim, which was correct when
   every effect was typed in by hand. Now that abilities and moves add their
   own, a rebuild has to keep the hand-entered ones and re-derive the rest —
   otherwise the automation's output is overwritten the moment anything is
   recalculated.
   --------------------------------------------------------------------- */
const __origRebuildNode = rebuildNode;
rebuildNode = function (node) {
  // Hand-entered effects are handed to buildStartSnapshot through the node, so
  // they are present while the turn's actions replay.
  node.__manualFx = (node.snapshot.fieldEffects || [])
    .filter(f => f.auto === false)
    .map(f => fxNormalise(Object.assign({}, f)));

  __origRebuildNode(node);

  // What survived the turn IS the answer: inherited effects were seeded, the
  // actions added, replaced or removed, and nothing is merged in afterwards.
  node.snapshot.fieldEffects = fxEnforceExclusive(node.snapshot.autoFx || []);
  delete node.__manualFx;
};


/* ---------------------------------------------------------------------
   12. Stat stages.

   Two halves that were both missing: nothing generated stat changes, and
   nothing displayed them.

   The Showdown snapshot already describes every move's stat effects, so
   there is no table to hand-maintain:
     boosts          -> applies to the target ("self" for Bulk Up etc.)
     self.boosts     -> applies to the user, guaranteed (Close Combat)
     secondary.boosts-> chance-based, so never applied silently

   Generated stages become ordinary `boost` log lines, the same treatment
   damage gets: one line per affected Pokemon, editable and deletable.
   --------------------------------------------------------------------- */

/* What a move does to stats, read straight from the dex. */
function moveStatEffects(moveName) {
  const d = Dex.psMove(moveName);
  const out = { self: null, target: null, secondaries: [] };
  if (!d) return out;
  if (d.boosts) {
    if (d.target === 'self' || d.target === 'adjacentAllyOrSelf') out.self = d.boosts;
    else out.target = d.boosts;
  }
  if (d.self && d.self.boosts) {
    out.self = Object.assign({}, out.self || {}, d.self.boosts);
  }
  const secs = [].concat(d.secondaries || [], d.secondary ? [d.secondary] : []);
  secs.forEach(sec => {
    if (!sec) return;
    if (sec.boosts) out.secondaries.push({ chance: sec.chance || 100, boosts: sec.boosts, onSelf: false });
    if (sec.self && sec.self.boosts) out.secondaries.push({ chance: sec.chance || 100, boosts: sec.self.boosts, onSelf: true });
  });
  return out;
}

function boostsToToken(slot, boosts) {
  const parts = Object.keys(boosts).filter(k => boosts[k]).map(k => k + (boosts[k] > 0 ? '+' : '') + boosts[k]);
  return parts.length ? slot + ' boost ' + parts.join(',') : null;
}
function boostsToText(slot, boosts) {
  const nm = (state.pokemon[slot] || {}).name || slot;
  const parts = Object.keys(boosts).filter(k => boosts[k]).map(k => {
    const label = k === 'acc' ? 'Accuracy' : k === 'eva' ? 'Evasion' : calc.Stats.displayStat(k);
    return (boosts[k] > 0 ? '+' : '') + boosts[k] + ' ' + label;
  });
  return slot + '(' + nm + '): ' + parts.join(', ') + '.';
}
function boostEntry(slot, boosts) {
  const raw = boostsToToken(slot, boosts);
  return raw ? { type: 'boost', raw, text: boostsToText(slot, boosts) } : null;
}

/* Replaces the version added earlier so that stat changes are produced
   alongside the damage lines. */
function commitMove(actorSlot, moveName, targets) {
  const actorName = state.pokemon[actorSlot].name || actorSlot;
  const names = targets.map(t => `${t}(${(state.pokemon[t] || {}).name || t})`);
  const text = targets.length
    ? `${actorSlot}(${actorName}) used ${moveName} on ${joinNames(names)}.`
    : `${actorSlot}(${actorName}) used ${moveName}.`;
  const raw = `${actorSlot} ${moveName}${targets.length ? ' ' + targets.join('') : ''}`;
  const moveEntry = { type: 'move', raw, text };

  const node = getCurrentNode();
  const snap = node && node.snapshot;
  if (!snap || !AutoRules.enabled()) { pushLog(moveEntry); return; }

  const fx = moveStatEffects(moveName);
  const statEntries = () => {
    const list = [];
    if (fx.self) { const e = boostEntry(actorSlot, fx.self); if (e) list.push(e); }
    if (fx.target) targets.forEach(t => { const e = boostEntry(t, fx.target); if (e) list.push(e); });
    // A self-targeting move has no target list, so its boosts land on the user.
    if (fx.target && !targets.length) { const e = boostEntry(actorSlot, fx.target); if (e) list.push(e); }
    return list;
  };

  const results = [];
  targets.forEach(t => {
    // hitCount is how many Pokemon this move actually hits, which is what
    // decides whether the 0.75x spread reduction applies (lib-30-calc.js).
    const r = Calc.run(actorSlot, moveName, t, snap, { hitCount: targets.length });
    if (r && r.rolls.length) results.push({ slot: t, r, roll: Calc.DEFAULT_ROLL,
                                            crit: false, hitCount: targets.length });
  });

  // No damage to choose between: apply the move and its stat changes directly.
  if (!results.length) { pushLogs([moveEntry].concat(statEntries())); return; }

  openDamageModal(actorSlot, moveName, results, snap, (chosen, secChosen) => {
    const entries = [moveEntry];
    chosen.forEach(c => {
      const before = hpPctOf(snap, c.slot);
      const dealt = c.r.pct[Calc.rollIndexFor(c.r, c.roll)];
      const after = hpPctString(Math.max(0, before - dealt));
      const nm = (state.pokemon[c.slot] || {}).name || c.slot;
      entries.push({ type: 'health', raw: `${c.slot} health ${after}`,
                     text: `${c.slot}(${nm})'s HP is now at ${after}.` });
    });
    statEntries().forEach(e => entries.push(e));
    (secChosen || []).forEach(sec => {
      const who = sec.onSelf ? [actorSlot] : targets;
      who.forEach(t => { const e = boostEntry(t, sec.boosts); if (e) entries.push(e); });
    });
    pushLogs(entries);
  }, fx, targets, actorSlot);
}

/* The modal gains a summary of the guaranteed stat changes and a checkbox for
   each chance-based one, which are never applied on their own. */
const __origOpenDamageModal = openDamageModal;
openDamageModal = function (actorSlot, moveName, results, snap, onConfirm, fx, targets, actor) {
  __origOpenDamageModal(actorSlot, moveName, results, snap, chosen => {
    const picked = [];
    document.querySelectorAll('#secList input[type=checkbox]:checked')
      .forEach(cb => picked.push(JSON.parse(cb.dataset.sec)));
    onConfirm(chosen, picked);
  });
  if (!fx) return;
  const body = document.getElementById('dmgBody');
  if (!body) return;

  const lines = [];
  if (fx.self) lines.push('<b>' + escapeHtml(actorSlot) + '</b> ' + escapeHtml(describeBoosts(fx.self)));
  if (fx.target) (targets && targets.length ? targets : [actorSlot]).forEach(t =>
    lines.push('<b>' + escapeHtml(t) + '</b> ' + escapeHtml(describeBoosts(fx.target))));

  const secs = (fx.secondaries || []).map((sec, i) =>
    `<label style="display:block;margin:3px 0;cursor:pointer">
       <input type="checkbox" data-sec='${escapeHtml(JSON.stringify(sec))}'>
       ${sec.chance}% chance: ${escapeHtml(sec.onSelf ? 'user ' : 'target ')}${escapeHtml(describeBoosts(sec.boosts))}
     </label>`).join('');

  if (!lines.length && !secs) return;
  const box = document.createElement('div');
  box.className = 'dmg-block';
  box.innerHTML =
    '<div style="font-family:var(--mono);font-size:11px;line-height:1.6">' +
    (lines.length ? '<b>Stat changes</b> (applied automatically)<br>' + lines.join('<br>') : '') +
    (secs ? (lines.length ? '<hr style="border:none;border-top:1px solid var(--line);margin:7px 0">' : '') +
            '<b>Chance effects</b> — tick any that happened<div id="secList">' + secs + '</div>' : '') +
    '</div>';
  body.appendChild(box);
};

function describeBoosts(b) {
  return Object.keys(b).filter(k => b[k]).map(k => {
    const label = k === 'acc' ? 'Accuracy' : k === 'eva' ? 'Evasion' : calc.Stats.displayStat(k);
    return (b[k] > 0 ? '+' : '') + b[k] + ' ' + label;
  }).join(', ');
}

/* ---- showing stat stages on the field -------------------------------- */
const __origBuildFieldMon = buildFieldMon;
buildFieldMon = function (slot) {
  const div = __origBuildFieldMon(slot);
  const node = getCurrentNode();
  const ms = (node && node.snapshot.active[slot]) || {};

    span.title = 'Stat stages — click to edit';

/* An extra entry in the field menu, inserted next to Health. */

function openStatStages(slot) {
  const node = getCurrentNode();
  if (!node || node.turn === 0) return;
  const ms = node.snapshot.active[slot] || {};
  const cur = Object.assign({}, ms.boosts || {});
  const nm = (state.pokemon[slot] || {}).name || slot;

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const rows = BOOST_KEYS.map(k => {
    const label = k === 'acc' ? 'Accuracy' : k === 'eva' ? 'Evasion' : calc.Stats.displayStat(k);
    return `<div class="stage-row">
      <span class="stage-name">${label}</span>
      <button class="stage-btn" data-k="${k}" data-d="-1">−</button>
      <span class="stage-val" data-k="${k}">${cur[k] || 0}</span>
      <button class="stage-btn" data-k="${k}" data-d="1">+</button>
      <span class="stage-mult" data-k="${k}">${stageMultiplier(k, cur[k] || 0)}</span>
    </div>`;
  }).join('');
  backdrop.innerHTML = `<div class="modal">
    <h2>Stat stages — ${escapeHtml(slot)}: ${escapeHtml(nm)}</h2>
    <div style="font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-bottom:8px">
      −6 to +6. These feed straight into the damage calculator.</div>
    ${rows}
    <div class="modal-actions">
      <button id="ssReset">Reset all</button>
      <button id="ssCancel">Cancel</button>
      <button class="primary" id="ssOk">Apply</button>
    </div></div>`;
  document.body.appendChild(backdrop);

  const redraw = () => BOOST_KEYS.forEach(k => {
    backdrop.querySelector(`.stage-val[data-k="${k}"]`).textContent = cur[k] || 0;
    backdrop.querySelector(`.stage-mult[data-k="${k}"]`).textContent = stageMultiplier(k, cur[k] || 0);
  });
  backdrop.querySelectorAll('.stage-btn').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    cur[k] = clamp((cur[k] || 0) + parseInt(b.dataset.d, 10), -6, 6);
    redraw();
  }));
  backdrop.querySelector('#ssCancel').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('#ssReset').addEventListener('click', () => {
    BOOST_KEYS.forEach(k => cur[k] = 0); redraw();
  });
  backdrop.querySelector('#ssOk').addEventListener('click', () => {
    backdrop.remove();
    // Written as an absolute set, so re-applying is idempotent on rebuild.
    const parts = BOOST_KEYS.map(k => k + '=' + (cur[k] || 0));
    pushLog({ type: 'boost', raw: slot + ' boost ' + parts.join(','),
              text: boostsToText(slot, cur).replace(/: \./, ': stat stages cleared.') });
  });
}

/* The familiar stage multipliers, so the numbers mean something at a glance. */
function stageMultiplier(stat, n) {
  if (!n) return '';
  if (stat === 'acc' || stat === 'eva') {
    const t = [3/9,3/8,3/7,3/6,3/5,3/4,1,4/3,5/3,2,7/3,8/3,3][n + 6];
    return '×' + (Math.round(t * 100) / 100);
  }
  const t = [2/8,2/7,2/6,2/5,2/4,2/3,1,1.5,2,2.5,3,3.5,4][n + 6];
  return '×' + (Math.round(t * 100) / 100);
}


/* ---------------------------------------------------------------------
   12b. Status by hand.

   The log grammar already carried `<slot> status <id>`: parseAndApplyToken
   writes it onto snapshot.active[slot].status, exportFlowchart round-trips it
   and the field mon paints the chip. What was missing was any way to produce
   one. Only a replay import ever did -- the field menu had no status entry and
   no move infers a status -- so a burn could not be entered by hand at all,
   even though the calculator halves physical Attack for one.

   The calculator matches on canonical Showdown ids ('brn', not 'Burn'), so the
   picker emits those and never free text.
   --------------------------------------------------------------------- */
const STATUS_CHOICES = [
  { id: '',    label: 'None' },
  { id: 'brn', label: 'Burn' },
  { id: 'par', label: 'Paralysis' },
  { id: 'slp', label: 'Sleep' },
  { id: 'frz', label: 'Freeze' },
  { id: 'psn', label: 'Poison' },
  { id: 'tox', label: 'Badly Poisoned' },
];

/* The wording parseAndApplyToken uses, so the line shown the moment it is
   applied is the same one a rebuild regenerates from the raw token. */
function statusLineText(slot, id) {
  const words = { brn:'burned', par:'paralyzed', slp:'put to sleep', frz:'frozen',
                  psn:'poisoned', tox:'badly poisoned' };
  const nm = (state.pokemon[slot] || {}).name || slot;
  return id ? `${slot}(${nm}) was ${words[id]}.`
            : `${slot}(${nm}) recovered from its status.`;
}

function openStatusPicker(slot) {
  const node = getCurrentNode();
  if (!node || node.turn === 0 || node.snapshot.winLose) return;
  const ms = node.snapshot.active[slot] || {};
  const was = ms.status || '';
  let cur = was;
  const nm = (state.pokemon[slot] || {}).name || slot;

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h2>Status — ${escapeHtml(slot)}: ${escapeHtml(nm)}</h2>
    <div style="font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-bottom:8px">
      Burn is the one that moves a damage number — it halves physical Attack in
      the calculator. The rest are tracked and shown on the field.</div>
    <div class="status-pick">${STATUS_CHOICES.map(c =>
      `<button class="status-opt${c.id === cur ? ' on' : ''}" data-id="${c.id}">${c.label}</button>`
    ).join('')}</div>
    <div class="modal-actions">
      <button id="stCancel">Cancel</button>
      <button class="primary" id="stOk">Apply</button>
    </div></div>`;
  document.body.appendChild(backdrop);

  const opts = [...backdrop.querySelectorAll('.status-opt')];
  opts.forEach(b => b.addEventListener('click', () => {
    cur = b.dataset.id;
    opts.forEach(o => o.classList.toggle('on', o.dataset.id === cur));
  }));
  backdrop.querySelector('#stCancel').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('#stOk').addEventListener('click', () => {
    backdrop.remove();
    if (cur === was) return;                  // nothing changed, log nothing
    pushLog({ type: 'status', raw: slot + ' status ' + (cur || 'none'),
              text: statusLineText(slot, cur) });
  });
}

/* Status sits next to Stat Stages in the field menu. Assignment-style wrapper,
   per the trap in NOTES.md §8. */
const __showMenuBeforeStatus = showFieldMonContextMenu;
showFieldMonContextMenu = function (evt, slot) {

  if (!menu) return;

             || items.find(i => /^Health$/i.test(i.textContent.trim()));

  el.textContent = 'Status';

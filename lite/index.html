      e.stopPropagation();
      showNodeContextMenu(e, n.id);
    });
    attachNodeLogTooltip(div, n);
    canvas.appendChild(div);
  });

  // Draw terminal (WINNING / LOSING) nodes with arrows from their parents.
  // These nodes are purely visual — no click handler, no context menu.
  terminals.forEach(t => {
    const parentPos = positions[t.parent.id];
    if (!parentPos) return;
    // Arrow from parent center-bottom to terminal center-top
    const x1 = parentPos.x + nodeWidth/2;
    const y1 = parentPos.y + nodeHeight;
    const x2 = t.x + nodeWidth/2;
    const y2 = t.y;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    line.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2}`);
    line.setAttribute('stroke', t.kind === 'win' ? 'var(--good)' : 'var(--bad)');
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-dasharray', '4 3');
    line.setAttribute('fill', 'none');
    svg.appendChild(line);

    const div = document.createElement('div');
    div.className = 'node terminal ' + t.kind;
    div.style.left = t.x + 'px';
    div.style.top = t.y + 'px';
    div.style.width = nodeWidth + 'px';
    const label = t.kind === 'win' ? 'WINNING' : 'LOSING';
    div.innerHTML = `<div class="node-turn">Result</div><div class="node-var">${label}</div>`;
    // Intentionally NO click handler — terminal nodes can't be selected or deleted.
    canvas.appendChild(div);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showNodeContextMenu(evt, nodeId) {
  closeAllContextMenus();
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  if (isMobile()) {
    const backdrop = document.createElement('div');
    backdrop.className = 'mobile-ctx-backdrop';
    backdrop.addEventListener('click', closeAllContextMenus);
    document.body.appendChild(backdrop);
    menu.style.left = '50%';
    menu.style.top = '50%';
    menu.style.transform = 'translate(-50%, -50%)';
    menu.style.width = 'min(86vw, 280px)';
  } else {
    menu.style.left = evt.clientX + 'px';
    menu.style.top = evt.clientY + 'px';
  }
  const node = state.nodes.find(n => n.id === nodeId);
  menu.innerHTML = `
    <div class="item" data-act="goto">Go To</div>
    <div class="item" data-act="delete">Delete</div>
  `;
  document.body.appendChild(menu);
  menu.querySelectorAll('.item').forEach(it => {
    it.addEventListener('click', () => {
      const act = it.dataset.act;
      if (act === 'goto') goToNode(nodeId);
      else if (act === 'delete') deleteNode(nodeId);
      closeAllContextMenus();
    });
  });
}

/* =================== TURN 0 SCREEN =================== */
function renderBattle() {
  const node = getCurrentNode();
  if (!node) return;
  const battle = document.getElementById('battleContent');
  document.getElementById('battleTurnInfo').textContent = `Turn ${node.turn}`;
  document.getElementById('battleStatusTag').textContent = `TURN ${node.turn}`;
  document.getElementById('logVariantTag').textContent = `T${node.turn} · ${node.variation}`;

  if (node.turn === 0) {
    renderTurn0Screen(battle);
  } else {
    renderTurnNScreen(battle);
  }
}

function renderTurn0Screen(container) {
  const node = getCurrentNode();
  const sel = state.turn0Selection;
  const opp = SLOTS_OPP.filter(s => pokemonReady(s));
  const self = SLOTS_SELF.filter(s => pokemonReady(s));

  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'turn0-screen';

  const grid = document.createElement('div');
  grid.className = 'turn0-grid';

  const selfCol = document.createElement('div');
  selfCol.className = 'turn0-side';
  selfCol.innerHTML = '<h3>Self · 1-6</h3>';
  self.forEach(s => {
    const p = state.pokemon[s];
    const orderIdx = sel.selfOrder.indexOf(s);
    const btn = document.createElement('button');
    btn.className = 'turn0-pokemon-btn' + (orderIdx >= 0 ? ' selected' : '');
    btn.innerHTML = `
      <img src="${spriteUrl(p.name)}" onerror="this.style.opacity=0.2" alt="${p.name}">
      <span class="slot-letter">${s}</span>
      <span>${p.name}</span>
      ${orderIdx >= 0 ? `<span class="order-badge">${orderIdx+1}</span>` : ''}`;
    btn.addEventListener('click', () => toggleTurn0Pick(s, 'self'));
    selfCol.appendChild(btn);
  });

  const center = document.createElement('div');
  center.className = 'turn0-center';
  const startBtn = document.createElement('button');
  startBtn.className = 'turn0-start';
  startBtn.textContent = 'Start';
  startBtn.disabled = !(sel.selfOrder.length > 0 && sel.oppOrder.length > 0);
  startBtn.addEventListener('click', commitTurn0);
  center.appendChild(startBtn);

  const fieldSize = document.createElement('div');
  fieldSize.className = 'field-size-row';
  fieldSize.innerHTML = `<label>Pokémon per side</label>`;
  const sel2 = document.createElement('select');
  [1,2,3].forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    if (n === state.fieldSize) o.selected = true;
    sel2.appendChild(o);
  });
  sel2.addEventListener('change', () => {
    state.fieldSize = parseInt(sel2.value);
    // Field size determines the field/back split — rebuild everything downstream.
    rebuildAllNodes();
    renderBattle();
    renderNodeEditor();
    renderLog();
  });
  fieldSize.appendChild(sel2);
  center.appendChild(fieldSize);

  const oppCol = document.createElement('div');
  oppCol.className = 'turn0-side';
  oppCol.innerHTML = '<h3>Opponent · A-F</h3>';
  opp.forEach(s => {
    const p = state.pokemon[s];
    const orderIdx = sel.oppOrder.indexOf(s);
    const btn = document.createElement('button');
    btn.className = 'turn0-pokemon-btn' + (orderIdx >= 0 ? ' selected' : '');
    btn.innerHTML = `
      <img src="${spriteUrl(p.name)}" onerror="this.style.opacity=0.2" alt="${p.name}">
      <span class="slot-letter">${s}</span>
      <span>${p.name}</span>
      ${orderIdx >= 0 ? `<span class="order-badge">${orderIdx+1}</span>` : ''}`;
    btn.addEventListener('click', () => toggleTurn0Pick(s, 'opp'));
    oppCol.appendChild(btn);
  });

  grid.appendChild(selfCol);
  grid.appendChild(center);
  grid.appendChild(oppCol);
  wrap.appendChild(grid);
  container.appendChild(wrap);
}

function toggleTurn0Pick(slot, side) {
  const sel = state.turn0Selection;
  const arr = side === 'self' ? sel.selfOrder : sel.oppOrder;
  const idx = arr.indexOf(slot);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(slot);
  // save into current node snapshot
  const node = getCurrentNode();
  if (node && node.turn === 0) {
    node.snapshot.turn0 = { selfOrder: [...sel.selfOrder], oppOrder: [...sel.oppOrder] };
    // The turn-0 picks determine which pokemon are on field/back for downstream turns,
    // so any change to selection must rebuild every dependent node.
    propagateFrom(node);
  }
  renderBattle();
  renderNodeEditor();
  renderLog();
}

function commitTurn0() {
  const node = getCurrentNode();
  if (!node || node.turn !== 0) return;
  const sel = state.turn0Selection;
  if (sel.selfOrder.length === 0 || sel.oppOrder.length === 0) return;

  // If a Turn 1 node with the same variation name already exists, just jump to it.
  const existing = state.nodes.find(n => n.turn === 1 && n.variation === node.variation);
  if (existing) {
    state.currentNodeId = existing.id;
    renderAll();
    return;
  }

  // Create a placeholder Turn 1 node and let the unified rebuild pipeline derive its
  // start state from the current Turn 0 selection. Keeps behavior consistent with
  // how propagation rebuilds later turns.
  const newNode = {
    id: uid(),
    turn: 1,
    variation: node.variation,
    branchTurn: node.branchTurn,
    parentId: node.id,
    snapshot: { active:{}, field:{opp:[],self:[]}, back:{opp:[],self:[]}, log:[] }
  };
  state.nodes.push(newNode);
  rebuildNode(newNode);
  state.currentNodeId = newNode.id;
  renderAll();
}

/* =================== TURN N SCREEN =================== */
function renderTurnNScreen(container) {
  const node = getCurrentNode();
  const snap = node.snapshot;
  const terminal = snap.winLose; // 'win' | 'lose' | undefined
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'battle-field';

  // back rows: top = opp back, bottom = self back
  const oppBack = document.createElement('div');
  oppBack.className = 'field-row-back';
  snap.back.opp.forEach(s => {
    const p = state.pokemon[s];
    const img = document.createElement('img');
    img.src = spriteUrl(p.name);
    img.alt = `${s}: ${p.name}`;
    img.dataset.slot = s;
    img.onerror = () => img.style.opacity = 0.2;
    if (snap.active[s]?.hp === '0%') img.style.filter = 'grayscale(1) brightness(0.7)';
    attachHoverTooltip(img, s);
    oppBack.appendChild(img);
  });
  wrap.appendChild(oppBack);

  // active area
  const active = document.createElement('div');
  active.className = 'field-row-active';

  const prevBtn = document.createElement('button');
  prevBtn.className = 'turn-nav prev';
  prevBtn.innerHTML = '‹';
  prevBtn.addEventListener('click', goToPrevTurn);
  active.appendChild(prevBtn);

  // Next-turn button is hidden whenever the current turn has a terminal
  // outcome (winning/losing) — the run is over for this variation.
  if (!terminal) {
    const nextBtn = document.createElement('button');
    nextBtn.className = 'turn-nav next';
    nextBtn.innerHTML = '›';
    nextBtn.addEventListener('click', goToNextTurn);
    active.appendChild(nextBtn);
  }

  const oppActive = document.createElement('div');
  oppActive.className = 'opp-active';
  snap.field.opp.forEach(s => oppActive.appendChild(buildFieldMon(s)));
  active.appendChild(oppActive);

  const selfActive = document.createElement('div');
  selfActive.className = 'self-active';
  snap.field.self.forEach(s => selfActive.appendChild(buildFieldMon(s)));
  active.appendChild(selfActive);

  wrap.appendChild(active);

  const selfBack = document.createElement('div');
  selfBack.className = 'field-row-back';
  snap.back.self.forEach(s => {
    const p = state.pokemon[s];
    const img = document.createElement('img');
    img.src = spriteUrl(p.name);
    img.alt = `${s}: ${p.name}`;
    img.onerror = () => img.style.opacity = 0.2;
    if (snap.active[s]?.hp === '0%') img.style.filter = 'grayscale(1) brightness(0.7)';
    attachHoverTooltip(img, s);
    selfBack.appendChild(img);
  });
  wrap.appendChild(selfBack);

  // Field effects display + opener button — bottom-right corner of the battle
  // pane. Active effects are stacked above the button as small badges.
  const fxBar = document.createElement('div');
  fxBar.className = 'field-fx-bar';
  const fxList = document.createElement('div');
  fxList.className = 'field-fx-list';
  (snap.fieldEffects || []).forEach(f => {
    const badge = document.createElement('div');
    badge.className = 'field-fx-badge';
    badge.textContent = `${f.name}: ${f.turns}`;
    fxList.appendChild(badge);
  });
  const fxBtn = document.createElement('button');
  fxBtn.className = 'field-fx-btn';
  fxBtn.textContent = 'Field...';
  fxBtn.addEventListener('click', openFieldEffectsModal);
  fxBar.appendChild(fxList);
  fxBar.appendChild(fxBtn);
  wrap.appendChild(fxBar);

  // Winning / Losing toggle bar — only shown when this is a leaf node (no
  // visual children). A node that already has descendants can't be marked as
  // a terminal outcome since the run continued past it.
  const hasChildren = state.nodes.some(n => {
    const p = findParentForArrow(n);
    return p && p.id === node.id;
  });
  if (!hasChildren) {
    const bar = document.createElement('div');
    bar.className = 'winlose-bar';
    const winBtn = document.createElement('button');
    winBtn.className = 'winlose-btn win' + (terminal === 'win' ? ' active' : '');
    winBtn.textContent = 'Winning';
    winBtn.addEventListener('click', () => toggleWinLose('win'));
    const loseBtn = document.createElement('button');
    loseBtn.className = 'winlose-btn lose' + (terminal === 'lose' ? ' active' : '');
    loseBtn.textContent = 'Losing';
    loseBtn.addEventListener('click', () => toggleWinLose('lose'));
    bar.appendChild(winBtn);
    bar.appendChild(loseBtn);
    wrap.appendChild(bar);
  }

  container.appendChild(wrap);
}

function toggleWinLose(which) {
  const node = getCurrentNode();
  if (!node || node.turn === 0) return;
  if (node.snapshot.winLose === which) {
    delete node.snapshot.winLose;
  } else {
    node.snapshot.winLose = which;
  }
  renderBattle();
  renderNodeEditor();
  renderLog();
}

/* =================== FIELD EFFECTS MODAL ===================
   Manages field effects (e.g., Tailwind, Trick Room, Sandstorm) that persist
   across turns with a timer. Effects added this turn can be edited/deleted;
   effects inherited from previous turns are shown but locked.
*/
function openFieldEffectsModal() {
  const node = getCurrentNode();
  if (!node || node.turn === 0) return;
  if (!node.snapshot.fieldEffects) node.snapshot.fieldEffects = [];

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h2>Field Effects</h2>
    <div class="field-fx-modal-list" id="fxModalList"></div>
    <div class="field-fx-modal-add" id="fxModalAdd" style="display:none;">
      <label style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px;margin-top:8px;">Field effect</label>
      <input type="text" id="fxNameInput" placeholder="e.g. Tailwind">
      <label style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px;margin-top:8px;">Turns</label>
      <input type="text" id="fxTurnsInput" placeholder="4" inputmode="numeric" pattern="[0-9]*">
      <div class="modal-actions" style="margin-top:10px;">
        <button id="fxAddCancel">Cancel</button>
        <button class="primary" id="fxAddOk">OK</button>
      </div>
    </div>
    <div class="modal-actions" id="fxMainActions">
      <button onclick="this.closest('.modal-backdrop').remove()">Close</button>
      <button class="primary" id="fxOpenAdd">Add field</button>
    </div>
  </div>`;
  document.body.appendChild(backdrop);

  function refresh() {
    const list = backdrop.querySelector('#fxModalList');
    const fx = node.snapshot.fieldEffects;
    if (fx.length === 0) {
      list.innerHTML = `<div style="font-family:var(--mono);font-size:11px;color:var(--ink-mute);font-style:italic;padding:8px 0;">No active field effects.</div>`;
      return;
    }
    list.innerHTML = '';
    fx.forEach((f, idx) => {
      const row = document.createElement('div');
      row.className = 'field-fx-modal-row';
      row.innerHTML = `<span class="fx-name">${escapeHtml(f.name)}</span><span class="fx-turns">${f.turns} turn${f.turns === 1 ? '' : 's'}</span>`;

      // Edit button: replaces the turns display with an inline numeric input,
      // plus ✓ to confirm and ✕ to cancel. Out of edit-mode, the delete and
      // edit buttons reappear.
      const edit = document.createElement('button');
      edit.className = 'fx-edit';
      edit.textContent = '✎';
      edit.title = 'Edit turns';
      edit.addEventListener('click', () => enterEditMode(row, f, idx));
      row.appendChild(edit);

      const del = document.createElement('button');
      del.className = 'fx-del';
      del.textContent = '×';
      del.title = 'Remove';
      del.addEventListener('click', () => {
        fx.splice(idx, 1);
        renderBattle();
        renderNodeEditor();
        renderLog();
        refresh();
      });
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  function enterEditMode(row, effect, idx) {
    // Swap the turns span for an input + confirm/cancel pair, hide normal buttons.
    const turnsSpan = row.querySelector('.fx-turns');
    const editBtn = row.querySelector('.fx-edit');
    const delBtn = row.querySelector('.fx-del');
    editBtn.style.display = 'none';
    delBtn.style.display = 'none';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'fx-edit-input';
    input.value = String(effect.turns);
    input.inputMode = 'numeric';
    input.pattern = '[0-9]*';
    input.addEventListener('input', () => { input.value = input.value.replace(/[^0-9]/g, ''); });
    turnsSpan.replaceWith(input);
    input.focus();
    input.select();

    const ok = document.createElement('button');
    ok.className = 'fx-edit-ok';
    ok.textContent = '✓';
    ok.title = 'Confirm';
    const cancel = document.createElement('button');
    cancel.className = 'fx-edit-cancel';
    cancel.textContent = '✕';
    cancel.title = 'Cancel';
    row.appendChild(ok);
    row.appendChild(cancel);

    function commit() {
      const v = parseInt(input.value, 10);
      if (isNaN(v) || v < 1) { alert('Turns must be a positive integer.'); input.focus(); return; }
      effect.turns = v;
      renderBattle();
      renderNodeEditor();
      renderLog();
      refresh();
    }
    function abort() { refresh(); }
    ok.addEventListener('click', commit);
    cancel.addEventListener('click', abort);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit();
      else if (e.key === 'Escape') abort();
    });
  }
  refresh();

  function showAddForm(show) {
    backdrop.querySelector('#fxModalAdd').style.display = show ? 'block' : 'none';
    backdrop.querySelector('#fxMainActions').style.display = show ? 'none' : 'flex';
    if (show) {
      const nameInp = backdrop.querySelector('#fxNameInput');
      nameInp.value = '';
      backdrop.querySelector('#fxTurnsInput').value = '';
      nameInp.focus();
    }
  }
  backdrop.querySelector('#fxOpenAdd').addEventListener('click', () => showAddForm(true));
  backdrop.querySelector('#fxAddCancel').addEventListener('click', () => showAddForm(false));

  // Restrict the turns input to digits only.
  const turnsInp = backdrop.querySelector('#fxTurnsInput');
  turnsInp.addEventListener('input', () => {
    turnsInp.value = turnsInp.value.replace(/[^0-9]/g, '');
  });

  function submitAdd() {
    const name = backdrop.querySelector('#fxNameInput').value.trim();
    const turnsRaw = turnsInp.value.trim();
    if (!name) { alert('Enter a field effect name.'); return; }
    if (!turnsRaw) { alert('Enter how many turns the effect lasts.'); return; }
    const turns = parseInt(turnsRaw, 10);
    if (isNaN(turns) || turns < 1) { alert('Turns must be a positive integer.'); return; }
    // Check for duplicate names (case-insensitive)
    const dup = node.snapshot.fieldEffects.some(f => f.name.toLowerCase() === name.toLowerCase());
    if (dup) { alert(`A field effect named "${name}" already exists on this turn.`); return; }
    node.snapshot.fieldEffects.push({ name, turns });
    renderBattle();
    renderNodeEditor();
    renderLog();
    showAddForm(false);
    refresh();
  }
  backdrop.querySelector('#fxAddOk').addEventListener('click', submitAdd);
  backdrop.querySelector('#fxNameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') turnsInp.focus();
    else if (e.key === 'Escape') showAddForm(false);
  });
  turnsInp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitAdd();
    else if (e.key === 'Escape') showAddForm(false);
  });
}

/* =================== FLIP SIDES ===================
   Swap the entire "self" side with the "opponent" side:
     1↔A, 2↔B, 3↔C, 4↔D, 5↔E, 6↔F
   This affects team data, every node's snapshot (active, field, back, log raw
   tokens, pendingSwitches, turn0 selection), the current turn 0 selection, and
   winLose markers (since Winning from the self perspective becomes Losing from
   the opponent's perspective and vice versa).
*/
function flipSides() {
  // Slot translation table both directions.
  const map = { '1':'A', '2':'B', '3':'C', '4':'D', '5':'E', '6':'F',
                'A':'1', 'B':'2', 'C':'3', 'D':'4', 'E':'5', 'F':'6' };
  const xlate = (s) => map[s] || s;
  // Translate a string that may contain slot characters (used for log raw tokens).
  // Tokens look like "<slot> <action> [args]" where the slot is the first whitespace-
  // delimited piece; trailing target lists are also slot-letter strings.
  function xlateToken(tok) {
    const parts = tok.split(/\s+/);
    if (parts.length === 0) return tok;
    // First token is the actor slot.
    if (parts[0].length === 1 && map[parts[0]]) parts[0] = xlate(parts[0]);
    // If action is "switch", the third token is the target slot.
    if (parts[1] === 'switch' && parts[2]) {
      if (parts[2].length === 1 && map[parts[2]]) parts[2] = xlate(parts[2]);
    }
    // Otherwise, the last token may be a target list (e.g. "13B") — translate
    // every character that is a known slot character.
    const last = parts[parts.length - 1];
    if (parts[1] !== 'switch' && parts[1] !== 'health' && /^[A-F1-6]+$/.test(last)) {
      parts[parts.length - 1] = last.split('').map(xlate).join('');
    }
    return parts.join(' ');
  }

  // 1. Swap team data
  const newPokemon = {};
  Object.keys(state.pokemon).forEach(slot => {
    newPokemon[xlate(slot)] = state.pokemon[slot];
  });
  state.pokemon = newPokemon;

  // 2. Walk every node and flip its snapshot in place.
  state.nodes.forEach(n => {
    const snap = n.snapshot;
    // active: keyed by slot
    if (snap.active) {
      const newActive = {};
      Object.keys(snap.active).forEach(s => { newActive[xlate(s)] = snap.active[s]; });
      snap.active = newActive;
    }
    // field/back: opp ↔ self, AND each slot letter translates to its counterpart.
    // Because both side-swap and letter-swap happen together, the end result is:
    // the slots that USED to be opp (A-F) now sit in self (since A → 1, etc.),
    // and self slots (1-6) now sit in opp.
    if (snap.field) {
      const newField = {
        opp: (snap.field.self || []).map(xlate),
        self: (snap.field.opp || []).map(xlate),
      };
      snap.field = newField;
    }
    if (snap.back) {
      const newBack = {
        opp: (snap.back.self || []).map(xlate),
        self: (snap.back.opp || []).map(xlate),
      };
      snap.back = newBack;
    }
    // Turn 0 selection (only present on Turn 0 nodes)
    if (snap.turn0) {
      const newT0 = {
        selfOrder: (snap.turn0.oppOrder || []).map(xlate),
        oppOrder: (snap.turn0.selfOrder || []).map(xlate),
      };
      snap.turn0 = newT0;
    }
    // Pending switches
    if (snap.pendingSwitches) {
      snap.pendingSwitches = snap.pendingSwitches.map(sw => ({
        outSlot: xlate(sw.outSlot),
        inSlot: xlate(sw.inSlot)
      }));
    }
    // Log entries: translate raw tokens; text will regenerate on rebuild.
    if (Array.isArray(snap.log)) {
      snap.log.forEach(entry => {
        if (entry.raw) entry.raw = xlateToken(entry.raw);
      });
    }
    // Win/Lose flips perspective: a win for self becomes a loss when sides swap.
    if (snap.winLose === 'win') snap.winLose = 'lose';
    else if (snap.winLose === 'lose') snap.winLose = 'win';
  });

  // 3. Current Turn 0 in-progress selection
  const sel = state.turn0Selection;
  state.turn0Selection = {
    selfOrder: (sel.oppOrder || []).map(xlate),
    oppOrder: (sel.selfOrder || []).map(xlate)
  };

  // 4. Rebuild ALL nodes so the log text rewrites with new names and the active
  // state propagates correctly through the new lineage.
  rebuildAllNodes();
  renderAll();
}

function buildFieldMon(slot) {
  const node = getCurrentNode();
  const snap = node.snapshot;
  const p = state.pokemon[slot];
  const monState = snap.active[slot] || { hp: '100%' };
  const div = document.createElement('div');
  div.className = 'field-mon' + (monState.hp === '0%' ? ' fainted' : '');
  div.innerHTML = `
    <img src="${spriteUrl(p.name)}" alt="${p.name}" onerror="this.style.opacity=0.2">
    <span class="label">${slot}</span>
    <span class="hp-label">${monState.hp}</span>`;
  div.addEventListener('click', (e) => {
    e.stopPropagation();
    // If a long-press tooltip just fired on this element, suppress the
    // synthesized click so the context menu doesn't fight the tooltip.
    if (div._suppressNextClick) { div._suppressNextClick = false; return; }
    showFieldMonContextMenu(e, slot);
  });
  attachHoverTooltip(div, slot);
  return div;
}

function attachNodeLogTooltip(el, node) {
  // Hover-only tooltip that shows the battle log for a flowchart node. Skipped
  // on touch devices since hovering doesn't apply — the user can tap a node
  // and use Go To to see the same info in the bottom log panel.
  let tt = null;
  function buildHTML() {
    if (node.turn === 0) {
      const sel = node.snapshot.turn0 || { selfOrder:[], oppOrder:[] };
      return `<div class="tt-title">Turn 0 · ${escapeHtml(node.variation)}</div>
        <div>Self chose: ${sel.selfOrder.join(', ') || '—'}</div>
        <div>Opp chose: ${sel.oppOrder.join(', ') || '—'}</div>`;
    }
    const log = node.snapshot.log || [];
    const lines = log.map((e, i) => {
      const num = String(i + 1).padStart(2, '0');
      const text = escapeHtml(e.text);
      return e.failed
        ? `<div><span style="color:var(--bad);opacity:.7;">${num}</span> <span style="text-decoration:line-through;color:var(--ink-mute);opacity:.7;">${text}</span></div>`
        : `<div><span style="color:var(--ink-mute);">${num}</span> ${text}</div>`;
    });
    const fields = (node.snapshot.fieldEffects || []);
    let fieldStr = '';
    if (fields.length > 0) {
      fieldStr = `<div style="margin-top:6px;font-style:italic;color:var(--accent-3);">${fields.map(f => escapeHtml(f.name) + ': ' + f.turns).join(', ')}</div>`;
    }
    let terminal = '';
    if (node.snapshot.winLose === 'win')  terminal = `<div style="margin-top:6px;color:var(--good);font-weight:700;">★ Winning</div>`;
    if (node.snapshot.winLose === 'lose') terminal = `<div style="margin-top:6px;color:var(--bad);font-weight:700;">✖ Losing</div>`;
    const body = lines.length > 0 ? lines.join('') : `<div style="color:var(--ink-mute);font-style:italic;">No actions logged.</div>`;
    return `<div class="tt-title">Turn ${node.turn} · ${escapeHtml(node.variation)}</div>${body}${fieldStr}${terminal}`;
  }
  el.addEventListener('mouseenter', (e) => {
    if (isMobile()) return;
    tt = document.createElement('div');
    tt.className = 'mon-tooltip node-log-tooltip';
    tt.innerHTML = buildHTML();
    document.body.appendChild(tt);
    moveTip(e);
  });
  el.addEventListener('mousemove', moveTip);
  el.addEventListener('mouseleave', () => { if (tt) { tt.remove(); tt = null; } });
  function moveTip(e) {
    if (!tt) return;
    let x = e.clientX + 14;
    let y = e.clientY + 14;
    const w = tt.offsetWidth, h = tt.offsetHeight;
    if (x + w > innerWidth - 10) x = e.clientX - w - 14;
    if (y + h > innerHeight - 10) y = e.clientY - h - 14;
    tt.style.left = x + 'px';
    tt.style.top = y + 'px';
  }
}

function attachHoverTooltip(el, slot) {
  let tt = null;
  function buildTipHTML() {
    const p = state.pokemon[slot];
    const node = getCurrentNode();
    const hp = node?.snapshot?.active?.[slot]?.hp || '100%';
    return `<div class="tt-title">${escapeHtml(slot)}: ${escapeHtml(p.name||'<empty>')}${p.gender?' ('+escapeHtml(p.gender)+')':''}${p.item?' @ '+escapeHtml(p.item):''} (${escapeHtml(hp)})</div>
      ${p.ability?'Ability: '+escapeHtml(p.ability)+'\n':''}
      ${p.shiny?'Shiny: '+escapeHtml(p.shiny)+'\n':''}
      ${p.tera?'Tera: '+escapeHtml(p.tera)+'\n':''}
      ${p.evs?'EVs: '+escapeHtml(p.evs)+'\n':''}
      ${p.nature?'Nature: '+escapeHtml(p.nature)+'\n':''}
      ${p.ivs?'IVs: '+escapeHtml(p.ivs)+'\n':''}
      ${p.moves.filter(Boolean).map(m=>'- '+escapeHtml(m)).join('\n')}`;
  }

  // Desktop hover behavior
  el.addEventListener('mouseenter', (e) => {
    if (isMobile()) return; // mobile uses long-press instead
    tt = document.createElement('div');
    tt.className = 'mon-tooltip';
    tt.innerHTML = buildTipHTML();
    document.body.appendChild(tt);
    moveTip(e);
  });
  el.addEventListener('mousemove', moveTip);
  el.addEventListener('mouseleave', () => { if (tt) { tt.remove(); tt = null; } });
  function moveTip(e) {
    if (!tt) return;
    let x = e.clientX + 14;
    let y = e.clientY + 14;
    const w = tt.offsetWidth, h = tt.offsetHeight;
    if (x + w > innerWidth - 10) x = e.clientX - w - 14;
    if (y + h > innerHeight - 10) y = e.clientY - h - 14;
    tt.style.left = x + 'px';
    tt.style.top = y + 'px';
  }

  // Touch: long-press to show the tooltip as a bottom sheet.
  let pressTimer = null;
  let pressStartX = 0, pressStartY = 0;
  let pressed = false;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    pressed = true;
    pressStartX = e.touches[0].clientX;
    pressStartY = e.touches[0].clientY;
    pressTimer = setTimeout(() => {
      if (!pressed) return;
      dismissTouchTooltip();
      const sheet = document.createElement('div');
      sheet.className = 'mon-tooltip mobile';
      sheet.innerHTML = buildTipHTML();
      document.body.appendChild(sheet);
      activeTouchTooltip = sheet;
      // suppress the upcoming click that would trigger the context menu
      el._suppressNextClick = true;
      if (navigator.vibrate) try { navigator.vibrate(15); } catch(e) {}
    }, 450);
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (!pressed) return;
    const dx = Math.abs(e.touches[0].clientX - pressStartX);
    const dy = Math.abs(e.touches[0].clientY - pressStartY);
    if (dx > 10 || dy > 10) {
      pressed = false;
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    }
  });
  el.addEventListener('touchend', () => {
    pressed = false;
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  });
  el.addEventListener('touchcancel', () => {
    pressed = false;
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  });
}

/* =================== FIELD CONTEXT MENU =================== */
function showFieldMonContextMenu(evt, slot) {
  closeAllContextMenus();
  // No actions allowed once the turn is marked Winning or Losing.
  const curNode = getCurrentNode();
  if (curNode && curNode.snapshot.winLose) return;
  const p = state.pokemon[slot];
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  if (isMobile()) {
    // Center on screen; appears above the log via z-index. Add a dimmed backdrop
    // so tapping outside dismisses.
    const backdrop = document.createElement('div');
    backdrop.className = 'mobile-ctx-backdrop';
    backdrop.addEventListener('click', closeAllContextMenus);
    document.body.appendChild(backdrop);
    menu.style.left = '50%';
    menu.style.top = '50%';
    menu.style.transform = 'translate(-50%, -50%)';
    menu.style.maxHeight = '80vh';
    menu.style.overflowY = 'auto';
    menu.style.width = 'min(86vw, 320px)';
  } else {
    menu.style.left = evt.clientX + 'px';
    menu.style.top = evt.clientY + 'px';
  }

  const menuItems = [];
  for (let i = 0; i < 4; i++) {
    if (p.moves[i]) menuItems.push({ label: 'Move ' + (i+1) + ': ' + p.moves[i], act: 'move', idx: i, moveName: p.moves[i] });
  }
  menuItems.push({ label: 'Switch', act: 'switch', hasSub: true });
  menuItems.push({ label: 'Health', act: 'health' });
  menuItems.push({ label: 'Dynamax', act: 'dynamax' });
  menuItems.push({ label: 'Mega Evolve', act: 'mega' });
  menuItems.push({ label: 'Terastallize', act: 'terast' });
  menuItems.push({ label: 'Z-Move', act: 'zmove' });

  menuItems.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item' + (item.hasSub ? ' has-sub' : '');
    div.textContent = item.label;
    // Hover-preview of switch submenu only on desktop (no touch).
    if (!isMobile()) {
      div.addEventListener('mouseenter', (e) => {
        if (item.act === 'switch') showSwitchSubmenu(div, slot);
      });
    }
    const runAction = (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (item.act === 'move') {
        openTargetPicker(slot, item.moveName);
        closeAllContextMenus();
      } else if (item.act === 'switch') {
        showSwitchSubmenu(div, slot);
      } else if (item.act === 'health') {
        openHealthModal(slot);
        closeAllContextMenus();
      } else if (item.act === 'dynamax') {
        logMechanic(slot, 'Dynamax');
        closeAllContextMenus();
      } else if (item.act === 'mega') {
        logMechanic(slot, 'Mega');
        closeAllContextMenus();
      } else if (item.act === 'terast') {
        logMechanic(slot, 'Terast');
        closeAllContextMenus();
      } else if (item.act === 'zmove') {
        logMechanic(slot, 'ZMove');
        closeAllContextMenus();
      }
    };
    div.addEventListener('click', runAction);
    // On mobile, also bind touchend directly — some browsers delay or swallow
    // synthesized clicks inside elements that have just changed display state.
    div.addEventListener('touchend', (e) => {
      if (e.changedTouches.length !== 1) return;
      runAction(e);
    });
    menu.appendChild(div);
  });
  document.body.appendChild(menu);
}

function showSwitchSubmenu(parentItem, slot) {
  document.querySelectorAll('.switch-list').forEach(s => s.remove());
  const node = getCurrentNode();
  const isSelf = isSelfSlot(slot);
  const backArr = isSelf ? node.snapshot.back.self : node.snapshot.back.opp;
  if (backArr.length === 0) return;
  const rect = parentItem.getBoundingClientRect();
  const sub = document.createElement('div');
  sub.className = 'switch-list';
  sub.style.left = (rect.right + 4) + 'px';
  sub.style.top = rect.top + 'px';
  // On mobile, hide the parent context menu so the switch sublist (centered) is
  // the sole focus. The backdrop stays so tapping outside still dismisses.
  if (isMobile()) {
    document.querySelectorAll('.context-menu').forEach(m => m.style.display = 'none');
  }
  backArr.forEach(targetSlot => {
    const p = state.pokemon[targetSlot];
    const node2 = getCurrentNode();
    const hp = node2.snapshot.active[targetSlot]?.hp || '100%';
    if (hp === '0%') return;
    const item = document.createElement('div');
    item.className = 'switch-item';
    item.innerHTML = `<img src="${spriteUrl(p.name)}" onerror="this.style.opacity=0.2"><span>${targetSlot}: ${p.name}</span>`;
    const run = (e) => {
      e.stopPropagation();
      e.preventDefault();
      doSwitch(slot, targetSlot);
      closeAllContextMenus();
    };
    item.addEventListener('click', run);
    item.addEventListener('touchend', (e) => {
      if (e.changedTouches.length !== 1) return;
      run(e);
    });
    sub.appendChild(item);
  });
  document.body.appendChild(sub);
}

function closeAllContextMenus() {
  document.querySelectorAll('.context-menu').forEach(m => m.remove());
  document.querySelectorAll('.switch-list').forEach(m => m.remove());
  document.querySelectorAll('.context-submenu').forEach(m => m.remove());
  document.querySelectorAll('.mobile-ctx-backdrop').forEach(m => m.remove());
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.context-menu') && !e.target.closest('.switch-list')) closeAllContextMenus();
});

/* =================== ACTIONS / LOG =================== */
function ensureLogArray() {
  const node = getCurrentNode();
  if (!node.snapshot.log) node.snapshot.log = [];
  return node.snapshot.log;
}

// Build the START-of-turn state for a node based on its ancestry parent.
// For Turn 1 nodes: derived from parent's Turn 0 selection.
// For Turn 2+ nodes: derived from parent's end-of-turn snapshot, applying any
//   pendingSwitches the parent left behind.
// For Turn 0 nodes: returns an empty battle state (turn0 selection lives separately).
function buildStartSnapshot(node) {
  if (node.turn === 0) {
    return {
      turn0: node.snapshot.turn0 || { selfOrder: [], oppOrder: [] },
      active: {}, field: {opp:[],self:[]}, back:{opp:[],self:[]}, log: []
    };
  }
  const parent = findParentForArrow(node);
  if (!parent) {
    // No parent found — keep whatever was there, but ensure log array exists.
    const fallback = deepCloneSnapshot(node.snapshot);
    fallback.log = [];
    delete fallback.pendingSwitches;
    delete fallback.winLose;
    return fallback;
  }
  if (parent.turn === 0) {
    // Turn 1: derive field/back from turn0 selection, all HPs at 100%.
    const sel = parent.snapshot.turn0 || {selfOrder:[], oppOrder:[]};
    const fs = state.fieldSize;
    const selfField = sel.selfOrder.slice(0, fs);
    const selfBack = sel.selfOrder.slice(fs);
    const oppField = sel.oppOrder.slice(0, fs);
    const oppBack = sel.oppOrder.slice(fs);
    const active = {};
    [...selfField, ...selfBack, ...oppField, ...oppBack].forEach(s => {
      active[s] = { hp: '100%', mega: false, dynamax: false, terast: false };
    });
    return {
      active,
      field: { opp: oppField, self: selfField },
      back: { opp: oppBack, self: selfBack },
      log: []
    };
  }
  // Turn 2+: clone parent's end-state. Since switches are now applied immediately
  // on the parent (during parseAndApplyToken), field/back already reflect the
  // post-switch positions and we just need a clean clone with a fresh log.
  const snap = deepCloneSnapshot(parent.snapshot);
  delete snap.pendingSwitches; // legacy: clear any old data that still has the flag
  // winLose belongs to the parent's turn only — don't carry it to this turn.
  delete snap.winLose;
  // Field effects are NOT auto-derived from the parent at rebuild time — each
  // turn owns its own list, fully editable by the user. The initial copy from
  // parent happens once at node creation (see goToNextTurn / + Variation).
  // rebuildNode preserves the node's existing fieldEffects across the rebuild.
  snap.fieldEffects = [];
  snap.log = [];
  return snap;
}

// Rebuild a node's snapshot: start-state + reapplied actions.
function rebuildNode(node) {
  const oldLog = (node.snapshot.log || []).slice();
  // winLose is a turn-level marker not derived from logs; preserve it across rebuild.
  const oldWinLose = node.snapshot.winLose;
  // Field effects belong to this turn independently — preserve verbatim,
  // stripping any legacy `inherited` flag from older data.
  const oldFx = (node.snapshot.fieldEffects || []).map(f => ({
    name: f.name, turns: f.turns
  }));
  const start = buildStartSnapshot(node);
  // Re-apply each logged action against `start`. The new log entries are pushed
  // by parseAndApplyToken — match them up with old entries (same order) to
  // carry forward the `failed` flag, which is a user mark independent of state.
  oldLog.forEach(entry => {
    parseAndApplyToken(entry.raw, start);
    const just = start.log[start.log.length - 1];
    if (just && entry.failed) just.failed = true;
  });
  if (oldWinLose) start.winLose = oldWinLose;
  start.fieldEffects = oldFx;
  node.snapshot = start;
}

// All nodes that depend on this node via variation ancestry. A node `n` depends on
// `source` if `source` lies on the arrow-parent chain walking up from `n`.
// Equivalent: source.turn < n.turn AND walking up from n eventually hits source.
function getDescendantNodes(source) {
  // Topologically sort by turn ascending — that way when we rebuild, parents are
  // already up-to-date.
  const out = [];
  const candidates = state.nodes.filter(n => n.turn > source.turn);
  candidates.sort((a, b) => a.turn - b.turn);
  // Walk-up cache for efficiency
  const dependsOn = new Map();
  function depends(n) {
    if (dependsOn.has(n.id)) return dependsOn.get(n.id);
    if (n.turn <= source.turn) {
      dependsOn.set(n.id, n.id === source.id);
      return n.id === source.id;
    }
    const p = findParentForArrow(n);
    const result = p ? (p.id === source.id ? true : depends(p)) : false;
    dependsOn.set(n.id, result);
    return result;
  }
  candidates.forEach(n => { if (depends(n)) out.push(n); });
  return out;
}

// Propagate changes from `source` outward.
function propagateFrom(source) {
  const downstream = getDescendantNodes(source);
  downstream.forEach(n => rebuildNode(n));
}

// Rebuild every node in the graph in turn order. Useful when something global
// changes (e.g. pokemon name/move edits, field size, team imports) where it's
// simpler to recompute everything than to figure out the affected subset.
function rebuildAllNodes() {
  const sorted = [...state.nodes].sort((a, b) => a.turn - b.turn);
  sorted.forEach(n => {
    if (n.turn === 0) return; // turn 0 has no derived state
    rebuildNode(n);
  });
}

function pushLog(entry) {
  const node = getCurrentNode();
  // Block new actions on turns that have been marked as Winning or Losing —
  // the run is considered over for this variation.
  if (node.snapshot.winLose) return;
  const log = ensureLogArray();
  log.push(entry);
  // Rebuild current node from start + log (applies the new action's effect).
  rebuildNode(node);
  // Propagate to all downstream descendants.
  propagateFrom(node);
  // Live re-render every visual surface.
  renderBattle();
  renderNodeEditor();
  renderLog();
}

function logMechanic(slot, mech) {
  // raw token: "<slot> Mega" / "<slot> ZMove" / "<slot> Dynamax" / "<slot> Terast"
  let text = '';
  const p = state.pokemon[slot];
  const name = p.name || slot;
  if (mech === 'Mega') text = `${slot}(${name}) is Mega Evolving!`;
  else if (mech === 'ZMove') text = `${slot}(${name}) is using a Z-Move!`;
  else if (mech === 'Dynamax') text = `${slot}(${name}) is Dynamaxing!`;
  else if (mech === 'Terast') text = `${slot}(${name}) Terastallized!`;
  // State flags are set during rebuild via parseAndApplyToken — no direct mutation here.
  pushLog({ type:'mechanic', raw: `${slot} ${mech}`, text });
}

function openTargetPicker(actorSlot, moveName) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  // Targets are restricted to pokemon currently ON THE FIELD. Pokemon in the
  // back can't be hit by a normal move, so we exclude them. Grouped into two
  // visually distinct containers (Opponent / Self) so the user can tell which
  // side they're targeting at a glance.
  const node = getCurrentNode();
  const oppField = [...node.snapshot.field.opp];
  const selfField = [...node.snapshot.field.self];
  let selected = new Set();
  backdrop.innerHTML = `<div class="modal">
    <h2>${escapeHtml(actorSlot)} → ${escapeHtml(moveName)}</h2>
    <div style="font-family:var(--mono);font-size:12px;color:var(--ink-mute);margin-bottom:12px;">Click targets (multi-select). No selection allowed.</div>
    <div class="target-side-group opp">
      <div class="target-side-label">Opponent</div>
      <div class="target-picker-grid" id="targetGridOpp"></div>
    </div>
    <div class="target-side-group self">
      <div class="target-side-label">Self</div>
      <div class="target-picker-grid" id="targetGridSelf"></div>
    </div>
    <div class="modal-actions">
      <button onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
      <button class="primary" id="targetOk">OK</button>
    </div>
  </div>`;
  document.body.appendChild(backdrop);

  function renderGroup(gridEl, slots, emptyMsg) {
    if (slots.length === 0) {
      gridEl.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--ink-mute);font-family:var(--mono);font-size:11px;padding:14px;">${emptyMsg}</div>`;
      return;
    }
    slots.forEach(s => {
      const p = state.pokemon[s];
      const monState = node.snapshot.active[s] || { hp:'100%' };
      const card = document.createElement('div');
      card.className = 'target-card';
      const faintStyle = monState.hp === '0%' ? 'filter:grayscale(1) brightness(0.7);' : '';
      card.innerHTML = `<img src="${spriteUrl(p.name)}" style="${faintStyle}" onerror="this.style.opacity=0.2"><div class="slot">${s}</div><div class="nm">${escapeHtml(p.name)}</div>`;
      card.addEventListener('click', () => {
        if (selected.has(s)) { selected.delete(s); card.classList.remove('selected'); }
        else { selected.add(s); card.classList.add('selected'); }
      });
      gridEl.appendChild(card);
    });
  }
  renderGroup(backdrop.querySelector('#targetGridOpp'), oppField, 'No opponent pokémon on the field.');
  renderGroup(backdrop.querySelector('#targetGridSelf'), selfField, 'No self pokémon on the field.');

  backdrop.querySelector('#targetOk').addEventListener('click', () => {
    const targets = [...selected];
    backdrop.remove();
    commitMove(actorSlot, moveName, targets);
  });
}

function commitMove(actorSlot, moveName, targets) {
  const actorName = state.pokemon[actorSlot].name || actorSlot;
  let text;
  if (targets.length === 0) {
    text = `${actorSlot}(${actorName}) used ${moveName}.`;
  } else {
    const names = targets.map(t => `${t}(${state.pokemon[t].name||t})`);
    let joined;
    if (names.length === 1) joined = names[0];
    else if (names.length === 2) joined = names.join(' and ');
    else joined = names.slice(0,-1).join(', ') + ', and ' + names[names.length-1];
    text = `${actorSlot}(${actorName}) used ${moveName} on ${joined}.`;
  }
  const raw = `${actorSlot} ${moveName}${targets.length ? ' ' + targets.join('') : ''}`;
  pushLog({ type:'move', raw, text });
}

function openHealthModal(slot) {
  const node = getCurrentNode();
  const cur = node.snapshot.active[slot]?.hp || '100%';
  openInputModal(`Set Health for ${slot}`, cur, (val) => {
    if (val == null) return;
    const actorName = state.pokemon[slot].name || slot;
    // pushLog handles state mutation via rebuildNode + propagation.
    pushLog({ type:'health', raw: `${slot} health ${val}`, text: `${slot}(${actorName})'s HP is now at ${val}.` });
  });
}

function doSwitch(slot, targetSlot) {
  const actorName = state.pokemon[slot].name || slot;
  const text = `${slot}(${actorName}) is switched out for ${targetSlot}(${state.pokemon[targetSlot].name||targetSlot}).`;
  // pushLog handles snapshot updates via the rebuild pipeline.
  pushLog({ type:'switch', raw: `${slot} switch ${targetSlot}`, text });
}

function goToPrevTurn() {
  const node = getCurrentNode();
  if (node.turn === 0) return;
  // Walk variation ancestry to find the previous turn's matching node.
  const parent = findParentForArrow(node);
  if (parent) {
    state.currentNodeId = parent.id;
    const cur = getCurrentNode();
    if (cur && cur.turn === 0) {
      state.turn0Selection = { 
        selfOrder: [...(cur.snapshot.turn0?.selfOrder || [])],
        oppOrder: [...(cur.snapshot.turn0?.oppOrder || [])]
      };
    }
    renderAll();
  }
}

function goToNextTurn() {
  const node = getCurrentNode();
  // Look for an existing node at the next turn with the SAME variation name —
  // that's the natural continuation of this lineage.
  const existing = state.nodes.find(n => n.turn === node.turn + 1 && n.variation === node.variation);
  if (existing) {
    state.currentNodeId = existing.id;
    renderAll();
    return;
  }
  // Seed field effects from the parent: decrement each by 1, drop any whose
  // timer just hit zero. This happens once at creation; the new node owns the
  // list independently from this point forward.
  const seedFx = (node.snapshot.fieldEffects || [])
    .map(f => ({ name: f.name, turns: f.turns - 1 }))
    .filter(f => f.turns > 0);
  // Create a placeholder node, then immediately rebuild it from its variation parent.
  // This guarantees the new node uses the same start-state derivation logic that
  // propagation relies on, keeping behavior consistent everywhere.
  const newNode = {
    id: uid(),
    turn: node.turn + 1,
    variation: node.variation,
    branchTurn: node.branchTurn,
    parentId: node.id,
    snapshot: {
      active:{}, field:{opp:[],self:[]}, back:{opp:[],self:[]},
      log:[],
      fieldEffects: seedFx
    }
  };
  state.nodes.push(newNode);
  rebuildNode(newNode);
  state.currentNodeId = newNode.id;
  renderAll();
}

/* =================== LOG RENDER =================== */
function renderLog() {
  const node = getCurrentNode();
  const body = document.getElementById('logBody');
  body.innerHTML = '';
  // Reset button only applies to Turn 1+ — no actions exist on Turn 0.
  const resetBtn = document.getElementById('logResetBtn');
  if (resetBtn) resetBtn.disabled = !node || node.turn === 0;
  if (!node) return;
  if (node.turn === 0) {
    // Show turn 0 selection summary
    const sel = node.snapshot.turn0 || { selfOrder: [], oppOrder: [] };
    const line = document.createElement('div');
    line.className = 'log-line';
    line.style.cursor = 'default'; // not reorderable on turn 0
    line.innerHTML = `<span class="log-num">T0</span><span class="log-text">Self chose: ${sel.selfOrder.join(', ')||'—'} · Opp chose: ${sel.oppOrder.join(', ')||'—'}</span>`;
    body.appendChild(line);
    return;
  }
  const log = node.snapshot.log || [];
  log.forEach((entry, idx) => {
    const line = document.createElement('div');
    line.className = 'log-line' + (entry.failed ? ' failed' : '');
    line.dataset.idx = idx;
    line.draggable = true;
    line.innerHTML = `<span class="drag-grip" aria-hidden="true">⋮⋮</span><span class="log-num">${String(idx+1).padStart(2,'0')}</span><span class="log-text">${escapeHtml(entry.text)}</span><button class="del-btn" title="Delete">×</button>`;
    // Click/tap on the text toggles the "failed" mark. Strikethrough is purely
    // visual on the log; the export gets a " (failed)" suffix on the raw token.
    line.querySelector('.log-text').addEventListener('click', (e) => {
      e.stopPropagation();
      entry.failed = !entry.failed;
      // No state recompute needed — the action's effect on HP/positions is
      // unchanged, this is just a label. Just re-render the log to flip the
      // strikethrough on/off.
      renderLog();
    });
    line.querySelector('.del-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      log.splice(idx, 1);
      rebuildNode(node);
      propagateFrom(node);
      renderBattle();
      renderNodeEditor();
      renderLog();
    });
    attachLogLineDrag(line, idx);
    body.appendChild(line);
  });

  // Pinned field effects entry — shown above the terminal entry. Italic line
  // listing all active effects on this turn. Not draggable, not deletable
  // (manage through the Field... modal).
  const fx = node.snapshot.fieldEffects || [];
  if (fx.length > 0) {
    const fxLine = document.createElement('div');
    fxLine.className = 'log-line field-fx-line';
    const fxStr = fx.map(f => `${escapeHtml(f.name)}: ${f.turns}`).join(', ');
    fxLine.innerHTML = `<span class="log-num">✦</span><span class="log-text">${fxStr}</span>`;
    body.appendChild(fxLine);
  }

  // Pinned terminal entry — shown last when the turn is marked Winning/Losing.
  // Not draggable, not deletable (toggle the button on the battle screen to remove).
  if (node.snapshot.winLose) {
    const which = node.snapshot.winLose;
    const term = document.createElement('div');
    term.className = 'log-line terminal ' + which;
    term.innerHTML = `<span class="log-num">${which === 'win' ? '★' : '✖'}</span><span class="log-text">(${which === 'win' ? 'Winning' : 'Losing'})</span>`;
    body.appendChild(term);
  }
}

/* =================== RESET CURRENT TURN =================== */
// Clears every action from the current turn's variation, including its
// winning/losing terminal marker. Downstream nodes get rebuilt to reflect the
// empty start state. Turn 0 selection is left alone — resetting Turn 0 would
// clear the player picks, which is the wrong tool for that job (delete the
// node instead via the flowchart context menu).
function resetCurrentTurnLog() {
  const node = getCurrentNode();
  if (!node) return;
  if (node.turn === 0) return; // turn 0 has no action log to clear
  node.snapshot.log = [];
  delete node.snapshot.winLose;
  // Clear all field effects for this turn — there's no special "inherited"
  // carve-out anymore; the user owns each turn's list completely.
  node.snapshot.fieldEffects = [];
  rebuildNode(node);
  propagateFrom(node);
  renderBattle();
  renderNodeEditor();
  renderLog();
}

/* =================== LOG REORDER (DRAG) =================== */
function commitLogReorder(fromIdx, toIdx) {
  const node = getCurrentNode();
  const log = node.snapshot.log;
  if (!log) return;
  if (fromIdx === toIdx) return;
  if (fromIdx < 0 || toIdx < 0 || fromIdx >= log.length || toIdx > log.length) return;
  const [moved] = log.splice(fromIdx, 1);
  // If the destination index was after the source, removing first shifts it down by 1.
  if (toIdx > fromIdx) toIdx -= 1;
  log.splice(toIdx, 0, moved);
  rebuildNode(node);
  propagateFrom(node);
  renderBattle();
  renderNodeEditor();
  renderLog();
}

function attachLogLineDrag(line, idx) {
  // ===== Desktop HTML5 drag =====
  line.addEventListener('dragstart', (e) => {
    line.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', String(idx)); } catch(_) {}
    // Use the row itself as the drag image
    if (e.dataTransfer.setDragImage) {
      try { e.dataTransfer.setDragImage(line, 20, 10); } catch(_) {}
    }
  });
  line.addEventListener('dragend', () => {
    line.classList.remove('dragging');
    document.querySelectorAll('.log-line').forEach(l => {
      l.classList.remove('drop-above', 'drop-below');
    });
  });
  line.addEventListener('dragover', (e) => {
    e.preventDefault();
    const rect = line.getBoundingClientRect();
    const isAbove = (e.clientY - rect.top) < rect.height / 2;
    document.querySelectorAll('.log-line').forEach(l => {
      l.classList.remove('drop-above', 'drop-below');
    });
    line.classList.add(isAbove ? 'drop-above' : 'drop-below');
  });
  line.addEventListener('dragleave', (e) => {
    // Only clear if leaving entirely (not for entering a child)
    if (!line.contains(e.relatedTarget)) {
      line.classList.remove('drop-above', 'drop-below');
    }
  });
  line.addEventListener('drop', (e) => {
    e.preventDefault();
    const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
    if (isNaN(fromIdx)) return;
    const rect = line.getBoundingClientRect();
    const isAbove = (e.clientY - rect.top) < rect.height / 2;
    const toIdx = isAbove ? idx : idx + 1;
    document.querySelectorAll('.log-line').forEach(l => {
      l.classList.remove('drop-above', 'drop-below');
    });
    commitLogReorder(fromIdx, toIdx);
  });

  // ===== Mobile long-press → drag =====
  let pressTimer = null;
  let dragGhost = null;
  let touchActive = false;
  let touchStartY = 0;
  let touchStartX = 0;

  line.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    if (e.target.closest('.del-btn')) return; // delete button handles its own taps
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    pressTimer = setTimeout(() => {
      // Initiate drag after long-press
      touchActive = true;
      line.classList.add('dragging');
      // Create floating ghost
      dragGhost = line.cloneNode(true);
      dragGhost.classList.add('drag-ghost');
      dragGhost.classList.remove('dragging');
      dragGhost.style.left = (touchStartX - 30) + 'px';
      dragGhost.style.top = (touchStartY - 16) + 'px';
      dragGhost.style.width = (line.offsetWidth - 20) + 'px';
      document.body.appendChild(dragGhost);
      if (navigator.vibrate) try { navigator.vibrate(20); } catch(_) {}
    }, 350);
  }, { passive: true });

  line.addEventListener('touchmove', (e) => {
    if (!touchActive) {
      // If user moves before long-press fires, cancel
      if (pressTimer) {
        const dx = Math.abs(e.touches[0].clientX - touchStartX);
        const dy = Math.abs(e.touches[0].clientY - touchStartY);
        if (dx > 10 || dy > 10) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      }
      return;
    }
    e.preventDefault();
    const t = e.touches[0];
    if (dragGhost) {
      dragGhost.style.left = (t.clientX - 30) + 'px';
      dragGhost.style.top = (t.clientY - 16) + 'px';
    }
    // Determine which log-line is under the finger
    document.querySelectorAll('.log-line').forEach(l => {
      l.classList.remove('drop-above', 'drop-below');
    });
    const target = findLogLineUnder(t.clientX, t.clientY);
    if (target && target !== line) {
      const rect = target.getBoundingClientRect();
      const isAbove = (t.clientY - rect.top) < rect.height / 2;
      target.classList.add(isAbove ? 'drop-above' : 'drop-below');
    }
  }, { passive: false });

  const finishTouch = (e) => {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    if (!touchActive) return;
    touchActive = false;
    line.classList.remove('dragging');
    if (dragGhost) { dragGhost.remove(); dragGhost = null; }
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    document.querySelectorAll('.log-line').forEach(l => {
      l.classList.remove('drop-above', 'drop-below');
    });
    if (!t) return;
    const target = findLogLineUnder(t.clientX, t.clientY);
    if (!target || target === line) return;
    const tIdx = parseInt(target.dataset.idx, 10);
    if (isNaN(tIdx)) return;
    const rect = target.getBoundingClientRect();
    const isAbove = (t.clientY - rect.top) < rect.height / 2;
    const toIdx = isAbove ? tIdx : tIdx + 1;
    commitLogReorder(idx, toIdx);
  };
  line.addEventListener('touchend', finishTouch);
  line.addEventListener('touchcancel', finishTouch);
}

function findLogLineUnder(x, y) {
  const all = document.querySelectorAll('#logBody .log-line');
  for (const l of all) {
    const r = l.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return l;
  }
  return null;
}

/* =================== EXPORT AS URL ===================
   Encodes the full flowchart text as a URL hash fragment using gzip + base64url.
   The hash never leaves the user's browser — no backend, no server, nothing
   logged anywhere. Anyone with the link decodes the same state locally on
   page load.
*/

// Convert a Uint8Array to a base64url string (URL-safe, no padding).
function bytesToBase64Url(bytes) {
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToBytes(str) {
  // Pad back to a multiple of 4 and revert URL-safe chars.
  const norm = str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice(0, (4 - str.length % 4) % 4);
  const bin = atob(norm);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function compressString(text) {
  // CompressionStream gives us native gzip on every modern browser. If it's
  // unavailable, fall back to uncompressed UTF-8 with a marker so the decoder
  // can tell the two formats apart.
  const input = new TextEncoder().encode(text);
  if (typeof CompressionStream === 'undefined') {
    return { bytes: input, compressed: false };
  }
  const cs = new CompressionStream('gzip');
  const writer = cs.writable.getWriter();
  writer.write(input);
  writer.close();
  const chunks = [];
  const reader = cs.readable.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  let total = 0;
  chunks.forEach(c => total += c.length);
  const out = new Uint8Array(total);
  let off = 0;
  chunks.forEach(c => { out.set(c, off); off += c.length; });
  return { bytes: out, compressed: true };
}

async function decompressBytes(bytes, compressed) {
  if (!compressed) return new TextDecoder().decode(bytes);
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const chunks = [];
  const reader = ds.readable.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  let total = 0;
  chunks.forEach(c => total += c.length);
  const out = new Uint8Array(total);
  let off = 0;
  chunks.forEach(c => { out.set(c, off); off += c.length; });
  return new TextDecoder().decode(out);
}

/* =================== URL ENCODING v2 ===================
   Improvements over the legacy gzip-text path (g/ prefix):
     - Use deflate-raw instead of gzip → saves the gzip 18-byte header+trailer.
     - Try brotli when available (currently only in some browsers) → ~10% better.
   Falls back gracefully through the chain: brotli → deflate-raw → gzip → none.
   The format flag in the prefix tells the decoder which algorithm to use.
   Old g/ and r/ URLs still decode via the legacy text path.
*/
async function compressRaw(bytes) {
  if (typeof CompressionStream === 'undefined') return { bytes, algo: 'none' };
  // Try brotli first (best compression), then deflate-raw, then gzip.
  for (const algo of ['brotli', 'deflate-raw', 'gzip']) {
    try {
      const cs = new CompressionStream(algo);
      const writer = cs.writable.getWriter();
      writer.write(bytes);
      writer.close();
      const chunks = [];
      const reader = cs.readable.getReader();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
      }
      let total = 0;
      chunks.forEach(c => total += c.length);
      const out = new Uint8Array(total);
      let off = 0;
      chunks.forEach(c => { out.set(c, off); off += c.length; });
      return { bytes: out, algo };
    } catch { /* try next */ }
  }
  return { bytes, algo: 'none' };
}

async function decompressRaw(bytes, algo) {
  if (algo === 'none') return bytes;
  const ds = new DecompressionStream(algo);
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const chunks = [];
  const reader = ds.readable.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  let total = 0;
  chunks.forEach(c => total += c.length);
  const out = new Uint8Array(total);
  let off = 0;
  chunks.forEach(c => { out.set(c, off); off += c.length; });
  return out;
}

async function openExportUrlModal() {
  let url;
  try {
    // Use the same text export the regular Export button produces, then
    // compress with the best algorithm available.
    const text = exportFlowchart();
    const bytes = new TextEncoder().encode(text);
    const { bytes: compressed, algo } = await compressRaw(bytes);
    const encoded = bytesToBase64Url(compressed);
    // Prefix encodes the algorithm so the decoder picks the right path.
    //   v2b/ → brotli       v2d/ → deflate-raw       v2g/ → gzip       v2n/ → none
    let prefix;
    if (algo === 'brotli')         prefix = 'v2b/';
    else if (algo === 'deflate-raw') prefix = 'v2d/';
    else if (algo === 'gzip')      prefix = 'v2g/';
    else                            prefix = 'v2n/';
    const base = location.origin + location.pathname + location.search;
    url = base + '#fc=' + prefix + encoded;
  } catch (err) {
    // Fall back to legacy gzip-text path on any error.
    try {
      const text = exportFlowchart();
      const { bytes, compressed } = await compressString(text);
      const encoded = bytesToBase64Url(bytes);
      const prefix = compressed ? 'g/' : 'r/';
      const base = location.origin + location.pathname + location.search;
      url = base + '#fc=' + prefix + encoded;
    } catch (err2) {
      alert('Failed to encode URL: ' + err2.message);
      return;
    }
  }

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h2>Export as URL</h2>
    <input type="text" id="urlInput" readonly value="">
    <div class="modal-actions">
      <button onclick="this.closest('.modal-backdrop').remove()">Close</button>
      <button class="primary" id="urlCopyBtn">Copy</button>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  const input = backdrop.querySelector('#urlInput');
  input.value = url;
  input.select();
  backdrop.querySelector('#urlCopyBtn').addEventListener('click', () => {
    input.select();
    document.execCommand('copy');
    backdrop.querySelector('#urlCopyBtn').textContent = 'Copied!';
  });
}

// Called at boot: if the URL hash contains an encoded flowchart, decode and
// apply it as if the user pasted into the Import modal.
//
// Recognized prefixes (decoder is forward-compatible):
//   v2b/  v2d/  v2g/  v2n/  — text export + (brotli|deflate-raw|gzip|none)
//   g/    r/                — legacy text export + (gzip|none)
async function maybeImportFromUrlHash() {
  const hash = location.hash || '';
  // v2 prefixes
  const mv2 = hash.match(/^#fc=v2([bdgn])\/(.+)$/);
  if (mv2) {
    const algoMap = { b: 'brotli', d: 'deflate-raw', g: 'gzip', n: 'none' };
    const algo = algoMap[mv2[1]];
    const encoded = mv2[2];
    try {
      const compressed = base64UrlToBytes(encoded);
      const decompressed = await decompressRaw(compressed, algo);
      const text = new TextDecoder().decode(decompressed);
      importFlowchart(text);
    } catch (err) {
      console.warn('Failed to decode v2 flowchart from URL hash:', err);
    }
    return;
  }
  // Legacy prefixes
  const mLegacy = hash.match(/^#fc=([gr])\/(.+)$/);
  if (mLegacy) {
    const compressed = mLegacy[1] === 'g';
    const encoded = mLegacy[2];
    try {
      const bytes = base64UrlToBytes(encoded);
      const text = await decompressBytes(bytes, compressed);
      importFlowchart(text);
    } catch (err) {
      console.warn('Failed to decode flowchart from URL hash:', err);
    }
  }
}

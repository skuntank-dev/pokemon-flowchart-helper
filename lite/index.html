/* =================== IMPORT / EXPORT TEAM =================== */
// Parse a single Showdown pokemon block (no leading prefix)
function parseShowdownBlock(blockLines) {
  const p = makeBlankPokemon();
  if (!blockLines.length) return p;
  // First line: Name (Gender) @ Item
  let first = blockLines[0].trim();
  // Strip leading slot prefix like "A: " or "1: " — caller may pass with or without
  first = first.replace(/^[A-F1-6]:\s*/, '');
  // @ Item
  const atIdx = first.lastIndexOf('@');
  if (atIdx >= 0) {
    p.item = first.slice(atIdx+1).trim();
    first = first.slice(0, atIdx).trim();
  }
  // Gender (M)/(F)
  const gm = first.match(/\(([MF])\)\s*$/);
  if (gm) {
    p.gender = gm[1];
    first = first.slice(0, gm.index).trim();
  }
  p.name = first.trim();

  let moveIdx = 0;
  for (let i = 1; i < blockLines.length; i++) {
    const ln = blockLines[i].trim();
    if (!ln) continue;
    if (/^Ability:/i.test(ln)) p.ability = ln.replace(/^Ability:\s*/i,'').trim();
    else if (/^Shiny:/i.test(ln)) p.shiny = ln.replace(/^Shiny:\s*/i,'').trim();
    else if (/^Tera Type:/i.test(ln)) p.tera = ln.replace(/^Tera Type:\s*/i,'').trim();
    else if (/^EVs:/i.test(ln)) p.evs = ln.replace(/^EVs:\s*/i,'').trim();
    else if (/^IVs:/i.test(ln)) p.ivs = ln.replace(/^IVs:\s*/i,'').trim();
    else if (/Nature\s*$/i.test(ln)) p.nature = ln.replace(/\s*Nature\s*$/i,'').trim();
    else if (/^-\s*/.test(ln) && moveIdx < 4) {
      p.moves[moveIdx++] = ln.replace(/^-\s*/,'').trim();
    }
  }
  return p;
}

function importTeamSide(side, text) {
  const slots = side === 'opp' ? SLOTS_OPP : SLOTS_SELF;
  // Split by blank lines
  const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  blocks.slice(0, 6).forEach((block, idx) => {
    const lines = block.split(/\r?\n/);
    state.pokemon[slots[idx]] = parseShowdownBlock(lines);
  });
  // New pokemon data → log text references and battle rendering both depend on
  // names/moves; rebuild every node so they're consistent.
  rebuildAllNodes();
  renderTeams();
  renderAll();
}

/* =================== EXPORT / IMPORT FLOWCHART =================== */
function exportFlowchart() {
  const lines = [];
  // Export A-F then 1-6 (only filled). Each block separated by a blank line.
  const blocks = [];
  [...SLOTS_OPP, ...SLOTS_SELF].forEach(slot => {
    const p = state.pokemon[slot];
    if (!p.name && p.moves.every(m=>!m)) return;
    const header = [];
    let h = `${slot}: ${p.name}`;
    if (p.gender) h += ` (${p.gender})`;
    if (p.item) h += ` @ ${p.item}`;
    header.push(h);
    if (p.ability) header.push(`Ability: ${p.ability}`);
    if (p.shiny) header.push(`Shiny: ${p.shiny}`);
    if (p.tera) header.push(`Tera Type: ${p.tera}`);
    if (p.evs) header.push(`EVs: ${p.evs}`);
    if (p.nature) header.push(`${p.nature} Nature`);
    if (p.ivs) header.push(`IVs: ${p.ivs}`);
    p.moves.forEach(m => { if (m) header.push(`- ${m}`); });
    blocks.push(header.join('\n'));
  });
  lines.push(blocks.join('\n\n'));
  lines.push('');
  lines.push(`On field: ${state.fieldSize}`);
  lines.push('');
  // For each turn 0 node, write its variation and chain of children for each variation
  // Order: walk in order traversal grouped by variation chain
  // We'll dump every node as "TurnN(var): tokens..."
  // Order: by turn ascending, then by variation name
  const sorted = [...state.nodes].sort((a,b) => a.turn - b.turn || a.variation.localeCompare(b.variation));
  sorted.forEach(n => {
    if (n.turn === 0) {
      const sel = n.snapshot.turn0 || {selfOrder:[], oppOrder:[]};
      const selfStr = sel.selfOrder.slice(0, state.fieldSize).join('') + (sel.selfOrder.length > state.fieldSize ? '(' + sel.selfOrder.slice(state.fieldSize).join('') + ')' : '');
      const oppStr = sel.oppOrder.slice(0, state.fieldSize).join('') + (sel.oppOrder.length > state.fieldSize ? '(' + sel.oppOrder.slice(state.fieldSize).join('') + ')' : '');
      lines.push(`Turn0(${n.variation}): ${selfStr}, ${oppStr}`);
    } else {
      const log = n.snapshot.log || [];
      // Each entry's raw token may carry a " (failed)" suffix before the comma
      // when the user has marked it as a failed attempt.
      const tokens = log.map(e => e.raw + (e.failed ? ' (failed)' : '')).join(', ');
      // Field effects: appended after the tokens, before any [WIN]/[LOSE].
      // Format: " {Name1: Turns1, Name2: Turns2}". Both inherited and
      // newly-added effects are serialized — on import the inheritance flag is
      // re-derived from parent context.
      const fx = n.snapshot.fieldEffects || [];
      let fxStr = '';
      if (fx.length > 0) {
        fxStr = ' {' + fx.map(f => `${f.name}: ${f.turns}`).join(', ') + '}';
      }
      // Terminal marker as a space-prefixed bracket suffix per spec.
      let suffix = '';
      if (n.snapshot.winLose === 'win') suffix = ' [WIN]';
      else if (n.snapshot.winLose === 'lose') suffix = ' [LOSE]';
      lines.push(`Turn${n.turn}(${n.variation}): ${tokens}${fxStr}${suffix}`);
    }
  });
  return lines.join('\n');
}

function importFlowchart(text) {
  // Reset
  [...SLOTS_SELF, ...SLOTS_OPP].forEach(s => state.pokemon[s] = makeBlankPokemon());
  state.nodes = [];
  state.currentNodeId = null;
  state.turn0Selection = { selfOrder: [], oppOrder: [] };

  const lines = text.split(/\r?\n/);
  // Split into pokemon blocks + remainder.
  // A new block starts whenever a line begins with a slot prefix like "A:" or "1:".
  // Blank lines also flush the current block (Showdown style). This dual-detection
  // makes the parser robust against malformed input that's missing blank separators.
  let blockBuffer = [];
  let mode = 'team';
  const isSlotHeader = (s) => /^[A-F1-6]:\s*\S/.test(s.trim());

  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (/^On field:/i.test(ln)) {
      flushBlock(blockBuffer);
      blockBuffer = [];
      const m = ln.match(/On field:\s*(\d+)/i);
      if (m) state.fieldSize = parseInt(m[1]) || 2;
      mode = 'turns';
      continue;
    }
    if (/^Turn\d+\(/i.test(ln)) {
      if (mode === 'team') {
        flushBlock(blockBuffer); blockBuffer = []; mode = 'turns';
      }
      parseTurnLine(ln);
      continue;
    }
    if (mode === 'team') {
      // If a slot header appears AND we already have content buffered, flush first.
      if (isSlotHeader(ln) && blockBuffer.length > 0) {
        flushBlock(blockBuffer);
        blockBuffer = [];
      }
      if (ln.trim() === '') {
        flushBlock(blockBuffer); blockBuffer = [];
      } else {
        blockBuffer.push(ln);
      }
    }
  }
  if (blockBuffer.length && mode === 'team') flushBlock(blockBuffer);

  // Make sure at least one turn 0 exists
  if (state.nodes.length === 0) createInitialNodeIfNone();
  // pick first turn0 as current
  const first0 = state.nodes.find(n => n.turn === 0);
  state.currentNodeId = first0 ? first0.id : (state.nodes[0]?.id || null);
  // Restore turn0 selection if applicable
  const cur = getCurrentNode();
  if (cur && cur.turn === 0) {
    state.turn0Selection = {
      selfOrder: [...(cur.snapshot.turn0?.selfOrder || [])],
      oppOrder: [...(cur.snapshot.turn0?.oppOrder || [])]
    };
  }
  // Final consistency pass: rebuild every turn-1+ node so their start states are
  // derived from the current set of parents and team data, not the values that
  // were live during the streaming import.
  rebuildAllNodes();
  renderAll();
}

function flushBlock(buffer) {
  if (!buffer.length) return;
  const first = buffer[0].trim();
  const m = first.match(/^([A-F1-6]):\s*/);
  if (!m) return;
  const slot = m[1];
  state.pokemon[slot] = parseShowdownBlock(buffer);
}

function parseTurnLine(line) {
  // Turn0(1): 13(24), BC(AE)  OR  TurnN(var): tokens, tokens
  const m = line.match(/^Turn(\d+)\(([^)]+)\):\s*(.*)$/i);
  if (!m) return;
  const turn = parseInt(m[1]);
  const variation = m[2];
  const rest = m[3].trim();
  if (turn === 0) {
    const parts = rest.split(',').map(p => p.trim());
    const selfPart = parts[0] || '';
    const oppPart = parts[1] || '';
    const selfOrder = parsePicks(selfPart);
    const oppOrder = parsePicks(oppPart);
    const node = {
      id: uid(), turn: 0, variation, branchTurn: 0, parentId: null,
      snapshot: { turn0: { selfOrder, oppOrder }, active: {}, field:{opp:[],self:[]}, back:{opp:[],self:[]}, log: [] }
    };
    state.nodes.push(node);
    return;
  }

  // Find parent via variation ancestry at turn-1.
  let parent = null;
  const ancestry = variationAncestry(variation);
  for (const v of ancestry) {
    parent = state.nodes.find(n => n.turn === turn - 1 && n.variation === v);
    if (parent) break;
  }
  if (!parent) {
    // last-resort fallback
    const candidates = state.nodes.filter(n => n.turn === turn - 1);
    parent = candidates[candidates.length-1];
  }
  if (!parent) return;

  const snap = deepCloneSnapshot(parent.snapshot);
  if (parent.turn === 0) {
    const sel = parent.snapshot.turn0 || {selfOrder:[], oppOrder:[]};
    const fs = state.fieldSize;
    snap.field = { self: sel.selfOrder.slice(0,fs), opp: sel.oppOrder.slice(0,fs) };
    snap.back = { self: sel.selfOrder.slice(fs), opp: sel.oppOrder.slice(fs) };
    snap.active = {};
    [...sel.selfOrder, ...sel.oppOrder].forEach(s => snap.active[s] = { hp: '100%' });
    delete snap.turn0;
  } else {
    // Legacy data from older exports may still carry pendingSwitches; drop it
    // since the new model applies switches immediately during token replay.
    delete snap.pendingSwitches;
  }
  // Parse trailing markers in reverse order: terminal first, then field effects,
  // since the format is "<tokens> {field effects} [WIN/LOSE]".
  let restClean = rest;
  let importedWinLose = null;
  const winMatch = restClean.match(/\s*\[WIN\]\s*$/i);
  const loseMatch = restClean.match(/\s*\[LOSE\]\s*$/i);
  if (winMatch) {
    importedWinLose = 'win';
    restClean = restClean.slice(0, winMatch.index).trim();
  } else if (loseMatch) {
    importedWinLose = 'lose';
    restClean = restClean.slice(0, loseMatch.index).trim();
  }
  // Field effects block: " {Name1: Turns1, Name2: Turns2}" at end of remaining
  // tokens. Match the rightmost {...} group, ignoring whitespace.
  let importedFieldEffects = null;
  const fxMatch = restClean.match(/\s*\{([^{}]*)\}\s*$/);
  if (fxMatch) {
    const inner = fxMatch[1].trim();
    if (inner.length > 0) {
      importedFieldEffects = inner.split(',').map(p => {
        const parts = p.split(':');
        if (parts.length < 2) return null;
        const name = parts[0].trim();
        const turns = parseInt(parts.slice(1).join(':').trim(), 10);
        if (!name || isNaN(turns) || turns < 1) return null;
        return { name, turns };
      }).filter(Boolean);
    } else {
      importedFieldEffects = [];
    }
    restClean = restClean.slice(0, fxMatch.index).trim();
  }
  // Strip trailing comma that may remain after removing markers
  restClean = restClean.replace(/,\s*$/, '');

  snap.log = [];
  const tokens = splitTopLevel(restClean, ',').map(s => s.trim()).filter(Boolean);
  tokens.forEach(tok => {
    // Strip optional " (failed)" suffix; mark the resulting log entry accordingly.
    let isFailed = false;
    let cleanTok = tok;
    const failMatch = cleanTok.match(/\s*\(failed\)\s*$/i);
    if (failMatch) {
      isFailed = true;
      cleanTok = cleanTok.slice(0, failMatch.index).trim();
    }
    parseAndApplyToken(cleanTok, snap);
    if (isFailed) {
      const just = snap.log[snap.log.length - 1];
      if (just) just.failed = true;
    }
  });
  if (importedWinLose) snap.winLose = importedWinLose;
  // The export format serializes field effects per turn. Absence of a {...}
  // block on a line means that turn has zero active effects — NOT "inherit
  // from parent". The deepClone above carried the parent's list across; we
  // overwrite it here unconditionally based on what the export said.
  snap.fieldEffects = (importedFieldEffects || []).map(f => ({ name: f.name, turns: f.turns }));

  // branchTurn: if parent's variation differs from this variation, this is a new branch.
  const branchTurn = (parent.variation === variation) ? parent.branchTurn : turn;

  const node = {
    id: uid(),
    turn,
    variation,
    branchTurn,
    parentId: parent.id,
    snapshot: snap
  };
  state.nodes.push(node);
}

function parsePicks(str) {
  // "13(24)" -> active [1,3], back [2,4]
  // "BC(AE)" -> active [B,C], back [A,E]
  const out = [];
  const m = str.match(/^([^()]*)(?:\(([^()]*)\))?$/);
  if (!m) return out;
  const active = (m[1]||'').split('').filter(Boolean);
  const back = (m[2]||'').split('').filter(Boolean);
  return [...active, ...back];
}

function splitTopLevel(str, sep) {
  return str.split(sep);
}

function parseAndApplyToken(tok, snap) {
  // Patterns:
  // "<slot> Mega" / "<slot> ZMove" / "<slot> Dynamax" / "<slot> Terast"
  // "<slot> health XX"
  // "<slot> switch <targetSlot>"
  // "<slot> <moveName> [targets]"
  const parts = tok.split(/\s+/);
  if (parts.length < 2) return;
  const slot = parts[0];
  const action = parts[1];
  const actorName = state.pokemon[slot]?.name || slot;

  if (['Mega','ZMove','Dynamax','Terast'].includes(action)) {
    if (snap.active[slot]) {
      if (action === 'Mega') snap.active[slot].mega = true;
      if (action === 'Dynamax') snap.active[slot].dynamax = true;
      if (action === 'Terast') snap.active[slot].terast = true;
    }
    let text = '';
    if (action === 'Mega') text = `${slot}(${actorName}) is Mega Evolving!`;
    else if (action === 'ZMove') text = `${slot}(${actorName}) is using a Z-Move!`;
    else if (action === 'Dynamax') text = `${slot}(${actorName}) is Dynamaxing!`;
    else if (action === 'Terast') text = `${slot}(${actorName}) Terastallized!`;
    snap.log.push({ type:'mechanic', raw: tok, text });
    return;
  }
  if (action === 'health') {
    const hp = parts.slice(2).join(' ');
    if (!snap.active[slot]) snap.active[slot] = {};
    snap.active[slot].hp = hp;
    snap.log.push({ type:'health', raw: tok, text: `${slot}(${actorName})'s HP is now at ${hp}.` });
    return;
  }
  if (action === 'switch') {
    const target = parts[2];
    // Immediately swap field<->back positions on the current snapshot so the
    // change is visible on the current turn's GUI. Next-turn nodes inherit
    // this already-swapped state — no pendingSwitches deferral needed.
    const isSelf = isSelfSlot(slot);
    if (snap.field && snap.back) {
      const fieldArr = isSelf ? snap.field.self : snap.field.opp;
      const backArr = isSelf ? snap.back.self : snap.back.opp;
      const fi = fieldArr.indexOf(slot);
      const bi = backArr.indexOf(target);
      if (fi >= 0 && bi >= 0) {
        fieldArr[fi] = target;
        backArr[bi] = slot;
      }
    }
    const targetName = state.pokemon[target]?.name || target;
    snap.log.push({ type:'switch', raw: tok, text: `${slot}(${actorName}) is switched out for ${target}(${targetName}).` });
    return;
  }
  // Otherwise: a move. The last contiguous slot-letters at end are targets.
  // Find trailing token that is purely [A-F1-6]+
  let moveTokens = parts.slice(1);
  let targets = [];
  const lastTok = moveTokens[moveTokens.length - 1];
  if (lastTok && /^[A-F1-6]+$/.test(lastTok)) {
    targets = lastTok.split('');
    moveTokens = moveTokens.slice(0, -1);
  }
  const moveName = moveTokens.join(' ');
  let text;
  if (targets.length === 0) {
    text = `${slot}(${actorName}) used ${moveName}.`;
  } else {
    const names = targets.map(t => `${t}(${state.pokemon[t]?.name||t})`);
    let joined;
    if (names.length === 1) joined = names[0];
    else if (names.length === 2) joined = names.join(' and ');
    else joined = names.slice(0,-1).join(', ') + ', and ' + names[names.length-1];
    text = `${slot}(${actorName}) used ${moveName} on ${joined}.`;
  }
  snap.log.push({ type:'move', raw: tok, text });
}

/* =================== ROW RESIZE (LOG HEIGHT) =================== */
(function setupRowSplitter() {
  const root = document.documentElement;
  const sp = document.getElementById('splitterH');
  if (!sp) return;
  let dragging = false;
  let startY = 0;
  let startH = 180;
  let mobileAtStart = false;

  function beginDrag(clientY) {
    dragging = true;
    startY = clientY;
    const logPanel = document.querySelector('.log-panel');
    startH = logPanel.getBoundingClientRect().height;
    mobileAtStart = isMobile();
    sp.classList.add('dragging');
    document.body.classList.add('resizing-rows');
  }
  function updateDrag(clientY) {
    if (!dragging) return;
    const dy = clientY - startY;
    const viewportH = window.innerHeight;
    const minLog = mobileAtStart ? 90 : 60;
    const maxLog = viewportH - (mobileAtStart ? 180 : 286);
    let newH = startH - dy;
    newH = Math.max(minLog, Math.min(maxLog, newH));
    root.style.setProperty(mobileAtStart ? '--mobileLogH' : '--logH', newH + 'px');
  }
  function endDrag() {
    if (dragging) {
      dragging = false;
      sp.classList.remove('dragging');
      document.body.classList.remove('resizing-rows');
    }
  }

  // Mouse
  sp.addEventListener('mousedown', (e) => {
    e.preventDefault();
    beginDrag(e.clientY);
  });
  document.addEventListener('mousemove', (e) => { if (dragging) updateDrag(e.clientY); });
  document.addEventListener('mouseup', endDrag);

  // Touch — dedicated handlers, not synthesized mouse events
  sp.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    e.preventDefault();
    beginDrag(e.touches[0].clientY);
  }, { passive: false });
  sp.addEventListener('touchmove', (e) => {
    if (!dragging || e.touches.length !== 1) return;
    e.preventDefault();
    updateDrag(e.touches[0].clientY);
  }, { passive: false });
  // Also listen on document so that finger leaving the splitter still tracks
  document.addEventListener('touchmove', (e) => {
    if (!dragging || e.touches.length !== 1) return;
    e.preventDefault();
    updateDrag(e.touches[0].clientY);
  }, { passive: false });
  document.addEventListener('touchend', endDrag);
  document.addEventListener('touchcancel', endDrag);
})();

/* =================== COLUMN RESIZE =================== */
(function setupSplitters() {
  const root = document.documentElement;
  const middle = document.querySelector('.middle');
  let dragging = null;
  let startX = 0;
  let startCol1 = 360;
  let startCol3 = 380;

  function getColVar(name, fallback) {
    const cs = getComputedStyle(root).getPropertyValue(name).trim();
    const n = parseFloat(cs);
    return isNaN(n) ? fallback : n;
  }

  document.querySelectorAll('.splitter').forEach(sp => {
    sp.addEventListener('mousedown', (e) => {
      e.preventDefault();
      dragging = sp;
      startX = e.clientX;
      const mr = middle.getBoundingClientRect();
      // Read current pixel widths of the side panels rather than CSS vars
      // (so the splitter starts from wherever the user last left it).
      const panels = middle.querySelectorAll(':scope > .panel');
      startCol1 = panels[0].getBoundingClientRect().width;
      startCol3 = panels[2].getBoundingClientRect().width;
      sp.classList.add('dragging');
      document.body.classList.add('resizing-cols');
    });
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const middleWidth = middle.getBoundingClientRect().width;
    const dx = e.clientX - startX;
    const minSide = 220;
    const minMiddle = 260;
    if (dragging.id === 'splitter1') {
      let newCol1 = startCol1 + dx;
      newCol1 = Math.max(minSide, newCol1);
      // ensure middle column keeps at least minMiddle
      const maxCol1 = middleWidth - startCol3 - minMiddle - 12;
      newCol1 = Math.min(newCol1, maxCol1);
      root.style.setProperty('--col1', newCol1 + 'px');
    } else if (dragging.id === 'splitter2') {
      let newCol3 = startCol3 - dx;
      newCol3 = Math.max(minSide, newCol3);
      const maxCol3 = middleWidth - startCol1 - minMiddle - 12;
      newCol3 = Math.min(newCol3, maxCol3);
      root.style.setProperty('--col3', newCol3 + 'px');
    }
    // re-render the node editor since canvas width changed
    renderNodeEditor();
  });

  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging.classList.remove('dragging');
      dragging = null;
      document.body.classList.remove('resizing-cols');
    }
  });
})();

/* =================== PINCH ZOOM ON NODE CANVAS =================== */
(function setupPinchZoom() {
  const wrap = document.getElementById('nodeCanvasWrap');
  const canvas = document.getElementById('nodeCanvas');
  if (!wrap || !canvas) return;
  let pinchStartDist = 0;
  let pinchStartScale = 1;
  let lastTouchTime = 0;

  function dist(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  wrap.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartScale = canvasScale;
    }
    lastTouchTime = Date.now();
  }, { passive: false });

  wrap.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStartDist > 0) {
      e.preventDefault();
      const d = dist(e.touches[0], e.touches[1]);
      const factor = d / pinchStartDist;
      canvasScale = Math.min(2, Math.max(0.4, pinchStartScale * factor));
      canvas.style.transform = `scale(${canvasScale})`;
    }
  }, { passive: false });

  wrap.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) pinchStartDist = 0;
  });
})();

/* =================== TOUCH SUPPORT FOR COLUMN SPLITTERS =================== */
// Column splitters (between desktop columns) are mouse-only by design but tablets
// >900px wide should still be able to drag them by touch. Synthesize mouse events
// from touch on the column splitters only (the row splitter has its own native
// touch handlers above).
(function addTouchToSplitters() {
  const fire = (target, type, touch) => {
    const evt = new MouseEvent(type, {
      bubbles: true, cancelable: true,
      clientX: touch.clientX, clientY: touch.clientY,
      button: 0
    });
    target.dispatchEvent(evt);
  };
  document.querySelectorAll('.splitter').forEach(sp => {
    sp.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      e.preventDefault();
      fire(sp, 'mousedown', e.touches[0]);
    }, { passive: false });
  });
  document.addEventListener('touchmove', (e) => {
    if (document.body.classList.contains('resizing-cols')) {
      if (e.touches.length === 1) {
        e.preventDefault();
        fire(document, 'mousemove', e.touches[0]);
      }
    }
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    if (document.body.classList.contains('resizing-cols')) {
      fire(document, 'mouseup', e.changedTouches[0] || { clientX:0, clientY:0 });
    }
  });
})();
